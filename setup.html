<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pandi English · Crear escuela</title>
<link rel="icon" href="icons/icon-192.png">
<script src="config.js"></script>
<style>
:root{--bg:#F1F6FD;--surface:#fff;--ink:#14233B;--ink-2:#5A6B85;--line:#D5E0EF;--green:#2FA84F;--green-d:#1F7F39;--red:#B92620}
@media (prefers-color-scheme: dark){:root{--bg:#0E1626;--surface:#17223A;--ink:#EAF1FF;--ink-2:#9FB0CC;--line:#2A3A5A;--red:#FF8A80;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px "Segoe UI",system-ui,sans-serif}
main{max-width:460px;margin:0 auto;padding:28px 16px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:26px} p{margin:0;color:var(--ink-2)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
input{font:inherit;font-size:17px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-transform:none;letter-spacing:0}
button{font:inherit;font-size:18px;padding:14px;border:0;border-radius:14px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);cursor:pointer}
button:disabled{opacity:.6}
.msg{padding:12px;border-radius:12px;background:var(--surface);border:2px solid var(--line)} .bad{color:var(--red)}
</style>
</head>
<body>
<main>
  <h1>Crear una escuela</h1>
  <p>Crea la escuela y la cuenta del profe (admin). Usa el código de configuración que guardaste en Supabase como <b>PANDI_SETUP_TOKEN</b>.</p>
  <form id="f">
    <div style="display:flex;flex-direction:column;gap:12px">
      <label>Nombre de la escuela<input id="school" required placeholder="Ej. Academia de inglés del centro"></label>
      <label>Nombre del profe<input id="name" required placeholder="Ej. Luis Pérez"></label>
      <label>Usuario del profe<input id="user" required autocapitalize="off" spellcheck="false" placeholder="Ej. profe.luis"></label>
      <label>Contraseña (mínimo 6)<input id="pass" required type="password" minlength="6"></label>
      <label>Código de configuración<input id="token" required type="password"></label>
      <label style="flex-direction:row;align-items:flex-start;gap:10px;text-transform:none;letter-spacing:0;font-size:15px"><input id="terms" type="checkbox" required style="width:22px;height:22px;flex:none;margin-top:2px">La escuela acepta los <a href="terminos.html" target="_blank">Términos y condiciones</a> y el <a href="privacidad.html" target="_blank">Aviso de privacidad</a>, y pedirá la autorización de los padres o tutores antes de crear cuentas de estudiantes.</label>
      <button type="submit" id="go">Crear escuela</button>
    </div>
  </form>
  <div id="out" class="msg" hidden></div>
  <p style="text-align:center"><a href="owner.html">Ir al panel del dueño (ver todas las escuelas)</a></p>
</main>
<script>
const out = document.getElementById('out');
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const c = window.PANDI_CONFIG || {};
  const show = (t, bad) => { out.hidden = false; out.className = 'msg' + (bad ? ' bad' : ''); out.textContent = t; };
  if (!c.supabaseUrl || !c.supabaseAnonKey) return show('Primero llena config.js con la URL y la llave anon de tu proyecto de Supabase.', true);
  const btn = document.getElementById('go'); btn.disabled = true;
  try {
    const r = await fetch(c.supabaseUrl.replace(/\/$/, '') + '/functions/v1/admin-users', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', apikey: c.supabaseAnonKey, Authorization: 'Bearer ' + c.supabaseAnonKey},
      body: JSON.stringify({action: 'create_school', school_name: v('school'), name: v('name'), username: v('user').toLowerCase(), password: v('pass'), setup_token: v('token')})
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) show(j.error || ('Error ' + r.status + '. Revisa que la función admin-users esté publicada.'), true);
    else show('¡Listo! Escuela creada. Ya puedes entrar a la app con el usuario "' + v('user').toLowerCase() + '".');
  } catch (err) {
    const base = c.supabaseUrl.replace(/\/$/, '');
    show('No se pudo conectar con ' + base + '. Posibles causas: (1) la función admin-users no está publicada (revisa Actions y Supabase → Edge Functions), (2) la URL en config.js está mal, (3) no hay internet. Detalle técnico: ' + (err && err.message ? err.message : err), true);
  }
  btn.disabled = false;
});
function v(id){ return document.getElementById(id).value.trim(); }
</script>
</body>
</html>
