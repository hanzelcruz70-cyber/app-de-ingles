<title>Pandi English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-width column; login first, then student app (map path) or admin panel; lesson player on top */
:root{
  --bg:#F1F6FD; --surface:#FFFFFF; --surface-2:#E6EEF9; --ink:#14233B; --ink-2:#5A6B85; --line:#D5E0EF;
  --red:#E8352E; --red-d:#B92620; --yellow:#FFC531; --yellow-d:#C98F00; --blue:#1E6FD9; --blue-d:#1453A8;
  --green:#2FA84F; --green-d:#1F7F39; --purple:#8E44C9; --purple-d:#6A2C9E; --orange:#FF8A1F;
  --locked:#C9D3E1; --locked-d:#A9B5C6; --ok-bg:#DDF5E3; --bad-bg:#FDE3E1; --ok-ink:#1F7F39; --bad-ink:#B92620;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --surface:#17223A; --surface-2:#1F2D4A; --ink:#EAF1FF; --ink-2:#9FB0CC; --line:#2A3A5A;
  --locked:#334360; --locked-d:#24314A; --ok-bg:#143823; --bad-bg:#3D1A1A; --ok-ink:#6EE08F; --bad-ink:#FF8A80; --yellow-d:#FFC531; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#17223A; --surface-2:#1F2D4A; --ink:#EAF1FF; --ink-2:#9FB0CC; --line:#2A3A5A;
  --locked:#334360; --locked-d:#24314A; --ok-bg:#143823; --bad-bg:#3D1A1A; --ok-ink:#6EE08F; --bad-ink:#FF8A80; --yellow-d:#FFC531; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;font-weight:700;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
[hidden]{display:none!important}
.screen[hidden]{display:none!important}
.mascot{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

.c-blue{--uc:var(--blue);--ucd:var(--blue-d);--uink:#fff}
.c-green{--uc:var(--green);--ucd:var(--green-d);--uink:#fff}
.c-red{--uc:var(--red);--ucd:var(--red-d);--uink:#fff}
.c-yellow{--uc:var(--yellow);--ucd:#C98F00;--uink:#14233B}
.c-purple{--uc:var(--purple);--ucd:var(--purple-d);--uink:#fff}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:16px;
  font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.02em;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn:disabled{background:var(--locked);box-shadow:0 4px 0 var(--locked-d);color:var(--ink-2);cursor:default}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.ghost{background:var(--surface);color:var(--blue);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.small{font-size:16px;padding:10px 14px;border-radius:13px}
.btn.blue:disabled,.btn.ghost:disabled{background:var(--locked);box-shadow:0 4px 0 var(--locked-d);color:var(--ink-2);border-color:transparent}
.node-wrap.has-tag{margin-top:34px}

/* login */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:28px 20px}
.brand{font-family:var(--display);font-size:32px;font-weight:700;text-align:center;letter-spacing:.01em}
.brand span{color:var(--green)} .brand i{font-style:normal;color:var(--blue)}
.hero-panda{width:150px;margin:0 auto;animation:bob 2.6s ease-in-out infinite}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 18px;font-size:17px;text-align:center}
.bubble b{font-family:var(--display);font-size:23px;font-weight:600;display:block;color:var(--green)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.in,textarea{font:inherit;font-size:18px;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.err{color:var(--bad-ink);background:var(--bad-bg);border-radius:12px;padding:10px 12px;font-size:15px;margin:0}
.demo{border:2px dashed var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.demo-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.demo-row .r{flex:1;min-width:0}
.demo-row small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.demo-row .tag{font-size:12px;letter-spacing:.06em;padding:4px 8px;border-radius:9px;color:#fff;background:var(--green)}
.demo-row .tag.adm{background:var(--purple)}

/* top bar + tabs */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg);border-bottom:2px solid var(--line)}
.topbar .logo{width:42px;flex:none}
.topbar .name{font-family:var(--display);font-size:20px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#home .topbar{gap:8px;padding:8px 12px}
#home .topbar .chip{font-size:16px;gap:2px}
#home .topbar .chip svg{width:19px;height:19px}
@media (max-width:400px){#home .topbar .name{font-size:17px}#home .topbar .logo{width:36px}}
.topbar .name span{color:var(--green)}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.chip svg{width:22px;height:22px}
.chip.fire{color:var(--orange)} .chip.xp{color:var(--yellow-d)}
.topbar .name .role-pill{color:#fff}
.role-pill{font-size:11px;letter-spacing:.1em;background:var(--purple);color:#fff;padding:4px 8px;border-radius:9px;vertical-align:middle;margin-left:6px;font-family:var(--body)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);border:2px solid var(--line);background:var(--surface)}
.iconbtn svg{width:20px;height:20px}
.tab{padding:16px 16px 110px}
.tab[hidden]{display:none}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6;box-sizing:border-box}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12px;color:var(--ink-2)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.nav.adm button[aria-current="page"]{color:var(--purple);background:color-mix(in srgb,var(--purple) 12%,transparent)}

/* map */
.unit-banner{background:var(--uc);color:var(--uink);border-radius:20px;padding:16px 18px;box-shadow:0 4px 0 var(--ucd);display:flex;align-items:center;gap:12px;margin-top:8px}
.unit-banner .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.unit-banner h2{font-size:26px}
.unit-banner p{margin:2px 0 0;font-size:14px;opacity:.92}
.unit-banner .count{margin-left:auto;font-family:var(--display);font-size:18px;background:rgba(255,255,255,.22);padding:6px 10px;border-radius:12px;white-space:nowrap}
.unit-banner.locked{background:var(--surface-2);color:var(--ink-2);box-shadow:0 4px 0 var(--line)}
.unit-banner.locked .count{background:var(--surface)}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:52px 0 30px}
.lv-head{position:sticky;z-index:4;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;margin:4px 0 6px;padding:12px 14px;border:0;border-radius:18px;background:var(--uc);color:var(--uink);box-shadow:0 4px 0 var(--ucd);text-align:left;font:inherit;transition:background .3s}
.lv-head.navable{cursor:pointer}
.lv-head.navable:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ucd)}
.lv-head .lv-arrow{font-size:34px;line-height:1;font-weight:800;opacity:.9;margin-top:-4px}
.lv-head .lv-txt{flex:1;min-width:0}
.lv-head .eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.lv-head b{display:block;font-family:var(--display);font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-head .lv-pill{flex:none;font-size:14px;font-weight:800;padding:8px 10px;border-radius:12px;border:2px solid color-mix(in srgb,var(--uink) 35%,transparent);background:color-mix(in srgb,var(--uink) 12%,transparent)}
.lv-backrow{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink-2);font:inherit;font-size:20px;font-weight:800;padding:6px 0 12px;cursor:pointer}
.lv-backrow span svg{width:22px;height:22px}
.lv-card{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:18px;border-radius:20px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);cursor:pointer;overflow:hidden;
  background:repeating-linear-gradient(120deg,color-mix(in srgb,hsl(var(--lh) 70% 50%) 16%,var(--surface)) 0 70px,color-mix(in srgb,hsl(var(--lh) 70% 50%) 9%,var(--surface)) 70px 140px)}
.lv-card.mine{border-color:var(--green);box-shadow:0 4px 0 var(--green)}
.lv-card .lv-info{flex:1;min-width:150px}
.lv-card .eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.lv-card h3{font-family:var(--display);font-size:28px;margin:4px 0 8px}
.lv-done{display:flex;align-items:center;gap:6px;color:var(--green);font-weight:800}
.lv-done span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff}
.lv-done span svg{width:14px;height:14px}
.lv-prog .bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:4px}
.lv-prog .bar i{display:block;height:100%;background:var(--green);border-radius:8px}
.lv-prog small{font-size:14px;color:var(--ink-2)}
.lv-pandi{width:64px;flex:none;animation:bob 2s ease-in-out infinite}
.lv-pandi img{width:100%}
.unit-div{display:flex;align-items:center;gap:10px;margin:22px 0 0;color:var(--ink-2);font-weight:800;font-size:16px;text-align:center}
.unit-div::before,.unit-div::after{content:'';flex:1;height:2px;background:var(--line)}
.unit-div span{max-width:75%}
.buddy{position:absolute;top:-18px;width:100px;height:129px;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.buddy.left{right:calc(100% + 26px)}
.buddy.right{left:calc(100% + 26px)}
.buddy .bprop{position:absolute;font-size:34px;line-height:1;pointer-events:none}
.buddy .bsay{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px;animation:pop .3s;z-index:2}
/* el Pandi: capas de 266×343 achicadas al tamaño del botón; el brazo gira en el hombro y la cabeza en el cuello */
.pr{position:absolute;left:0;top:0;width:266px;height:343px;transform:scale(.376);transform-origin:0 0;pointer-events:none}
.pr img{position:absolute;left:0;top:0;width:266px;height:343px;max-width:none}
.pr-g{position:absolute;inset:0}
.pr-all{transform-origin:133px 340px}.pr-body{transform-origin:133px 340px}
.pr-arm{transform-origin:194px 170px}.pr-head{transform-origin:104px 170px}
.pr-mc{opacity:0}
.pr-hold{position:absolute;left:216px;top:62px;font-size:38px;line-height:1}
/* párpados del mismo negro de las manchas; dormido muestra una línea clara de ojo cerrado */
.pr-lid{position:absolute;display:block;border-radius:50%;background:#151317;transform:scaleY(0);transform-origin:50% 0}
.pr-lidL{left:57px;top:80px;width:37px;height:36px}
.pr-lidR{left:127px;top:66px;width:35px;height:32px}
.pr-lid::after{content:'';position:absolute;left:18%;right:18%;top:38%;height:30%;border-bottom:3px solid rgba(235,235,240,.75);border-radius:50%;opacity:0}
.pr-lid{animation:prBlink 4s infinite}
.pr-lidR{animation-delay:.02s}
.pr-body{animation:prBob 2.4s ease-in-out infinite}
.pr-arm{animation:prRest 3s ease-in-out infinite}
@keyframes prBlink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes prBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(2px) scale(1.015,.985)}}
@keyframes prRest{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@keyframes prTalk{0%,50%{opacity:0}55%,65%,75%{opacity:1}60%,70%,80%,100%{opacity:0}}
@keyframes prTiltR{0%,100%{transform:rotate(1deg)}50%{transform:rotate(3deg)}}
/* gira el mundo sobre la mano */
.b-spin .pr-hold{left:214px;top:52px;font-size:40px;animation:prSpin 1s linear infinite}
.b-spin .pr-arm{animation:prHoldUp 1.6s ease-in-out infinite}
.b-spin .pr-head{animation:prTiltR 1.6s ease-in-out infinite}
@keyframes prSpin{to{transform:rotate(360deg)}}
@keyframes prHoldUp{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}
/* hace rebotar la pelota con la mano */
.b-bounce .pr-hold{left:216px;top:40px;animation:prBall .7s cubic-bezier(.45,0,.55,1) infinite}
.b-bounce .pr-arm{animation:prPump .7s ease-in-out infinite}
.b-bounce .pr-body{animation:prBob .7s ease-in-out infinite}
@keyframes prBall{0%,100%{transform:translateY(-36px) rotate(0)}50%{transform:translateY(8px) rotate(180deg) scale(1.1,.9)}}
@keyframes prPump{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg) translateY(4px)}}
/* lee el libro que sostiene en alto y pasa la página */
.b-read .pr-hold{left:206px;top:58px;font-size:44px;animation:prFlip 3.2s ease-in-out infinite}
.b-read .pr-head{animation:prRead 2.4s ease-in-out infinite}
.b-read .pr-arm{animation:none;transform:rotate(-4deg)}
@keyframes prFlip{0%,80%,100%{transform:scaleX(1)}88%{transform:scaleX(-1)}}
@keyframes prRead{0%,100%{transform:rotate(2deg)}50%{transform:rotate(4deg) translateY(2px)}}
/* mastica: cierra y abre la boca y mueve la cabeza */
.b-munch .pr-mc{animation:prChew 1.2s steps(1) infinite}
.b-munch .pr-head{animation:prNod 1.2s ease-in-out infinite}
@keyframes prChew{0%,25%{opacity:1}30%,45%{opacity:0}50%,75%{opacity:1}80%,100%{opacity:0}}
@keyframes prNod{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg) translateY(2px)}}
/* saluda con la mano y habla */
.b-wave .pr-arm{animation:prWave .9s ease-in-out infinite}
.b-wave .pr-mc{animation:prTalk 1.8s steps(1) infinite}
.b-wave .pr-head{animation:prTiltR 1.8s ease-in-out infinite}
@keyframes prWave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}}
/* flota con el globo */
.b-float .pr-hold{left:212px;top:6px;font-size:48px;animation:prBalloon 3s ease-in-out infinite}
.b-float .pr-all{animation:prFloat 3s ease-in-out infinite}
.b-float .pr-arm{animation:prHoldUp 3s ease-in-out infinite}
.b-float .pr-body{animation:prSway 3s ease-in-out infinite}
@keyframes prBalloon{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes prFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
/* malabares */
.b-juggle .pr-arm{animation:prJug .9s ease-in-out infinite}
.b-juggle .pr-head{animation:prUp 1.8s ease-in-out infinite}
.b-juggle .bprop{left:34px;top:-10px;font-size:20px;animation:juggle 1.8s linear infinite}
.b-juggle .p1{animation-delay:-.6s}.b-juggle .p2{animation-delay:-1.2s}
@keyframes prJug{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-10deg) translateY(-4px)}}
@keyframes prUp{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(-3deg)}}
/* canta: abre y cierra la boca, se mece y salen notas */
.b-sing .pr-mc{animation:prSing .8s steps(1) infinite}
.b-sing .pr-body{animation:prSway 1.6s ease-in-out infinite}
.b-sing .pr-arm{animation:prWave 1.6s ease-in-out infinite}
.b-sing .bprop{left:62px;top:10px;font-size:22px;opacity:0;animation:note 2.4s ease-out infinite}
.b-sing .p1{animation-delay:.8s}.b-sing .p2{animation-delay:1.6s}
@keyframes prSing{0%{opacity:0}50%{opacity:1}}
@keyframes prSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
/* duerme: ojos y boca cerrados, cabeza caída y respira */
.b-sleep .pr-lid{animation:none;transform:scaleY(1)}.b-sleep .pr-lid::after{opacity:1}
.b-sleep .pr-mc{opacity:1}
.b-sleep .pr-head{animation:prDroop 3s ease-in-out infinite}.b-sleep .pr-body{animation:prBreath 3s ease-in-out infinite}
.b-sleep .pr-arm{animation:none;transform:rotate(10deg)}
.b-sleep .bprop{left:66px;top:-4px;font-size:24px;animation:note 2.6s ease-out infinite}
@keyframes prDroop{0%,100%{transform:rotate(2deg)}50%{transform:rotate(4deg) translateY(2px)}}
@keyframes prBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.02,1.01)}}
/* al tocarlo: salta, saluda rápido y se ríe (boca abierta, ojos abiertos) */
.buddy.hop .pr-all{animation:prHop .5s ease-out 2}
.buddy.hop .pr-arm{animation:prWave .3s ease-in-out 3}
.buddy.hop .pr-mc{animation:none;opacity:0}
.buddy.hop .pr-lid{animation:none;transform:scaleY(0)}
@keyframes prHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px)}}
@media (prefers-reduced-motion:reduce){.buddy .pr *,.buddy .pr *::after,.buddy .bprop,.lv-pandi{animation:none!important}.buddy .bprop{opacity:1!important}}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.node{width:74px;height:74px;border-radius:50%;background:var(--uc);box-shadow:0 6px 0 var(--ucd);display:grid;place-items:center;color:var(--uink);transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ucd)}
.node svg{width:34px;height:34px}
.node.locked{background:var(--locked);box-shadow:0 6px 0 var(--locked-d);color:var(--ink-2)}
.node.current{outline:6px solid color-mix(in srgb,var(--uc) 30%,transparent);outline-offset:4px;animation:pulse 1.6s ease-in-out infinite}
.node-label{font-size:13px;color:var(--ink-2);text-align:center;line-height:1.2;max-width:130px}
.node-label b{display:block;color:var(--ink);font-size:14px}
.stars{display:flex;gap:1px;justify-content:center}
.stars svg{width:15px;height:15px}
.start-tag{position:absolute;top:-38px;background:var(--surface);border:2px solid var(--line);color:var(--uc);font-family:var(--display);font-weight:600;padding:5px 12px;border-radius:12px;white-space:nowrap;animation:bob 2s ease-in-out infinite;font-size:15px}
.start-tag::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.panda-say{display:flex;gap:10px;align-items:flex-end}
.panda-say .mascot{width:76px;flex:none}
.panda-say .bubble{text-align:left;font-size:16px;flex:1;min-width:0}

.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.section-title{font-size:24px;margin:4px 0 12px}
.muted{color:var(--ink-2);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--line)}
.task:first-of-type{border-top:0}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.check svg{width:18px;height:18px}
.due{display:inline-block;background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);padding:3px 10px;border-radius:10px;font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;background:var(--surface-2);color:var(--ink-2);letter-spacing:.04em}
.pill.warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.pill.okp{background:var(--ok-bg);color:var(--ok-ink)}
.note{background:color-mix(in srgb,var(--green) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:14px;padding:12px}

.profile{display:flex;gap:14px;align-items:center}
.profile .av{width:76px;height:76px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;overflow:hidden}
.profile .av .mascot{width:70px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat span{overflow-wrap:anywhere}
.stats.four{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.medal{text-align:center;padding:12px 6px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.medal .m{width:58px;height:58px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--yellow) 30%,transparent);border:3px solid var(--yellow)}
.medal.off .m{filter:grayscale(1);opacity:.35;border-color:var(--line);background:var(--surface-2)}
.medal b{font-size:13px;display:block;line-height:1.2}
.medal small{font-size:11px;color:var(--ink-2);font-weight:600;display:block;margin-top:3px;line-height:1.25}

/* ranking */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{padding:9px;border-radius:11px;color:var(--ink-2);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:8px;margin:8px 0 18px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .avatar{width:56px;height:56px;font-size:22px}
.pod .name{font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod .block{width:100%;border-radius:14px 14px 6px 6px;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:700;color:#fff}
.pod.p1 .block{height:96px;background:var(--yellow);color:#14233B;box-shadow:0 4px 0 #C98F00}
.pod.p2 .block{height:72px;background:#9DB0C8;box-shadow:0 4px 0 #7D8FA6}
.pod.p3 .block{height:56px;background:#D9874A;box-shadow:0 4px 0 #AF6630}
.pod .pts{font-size:13px;color:var(--ink-2)}
.avatar{border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;color:#fff;flex:none;position:relative}
.avatar.svg-av{background:none;overflow:hidden}
.avatar svg,.avmini svg,.av-preview svg{width:100%;height:100%;display:block}
.av-preview{width:150px;height:150px;margin:0 auto}
.av-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.av-tabs button{flex:none;font:inherit;font-size:15px;font-weight:700;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.av-tabs button[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.av-grid .avmini{display:block;width:62px;height:62px;margin:0 auto 4px}
.av-sw button{width:44px;height:44px}
.shop-item .avmini.big{display:block;width:84px;height:84px;margin:0 auto}
.avatar .emo{font-size:1.45em;line-height:1}
.avatar .acc{position:absolute;top:-.45em;right:-.45em;font-size:.95em;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.avatar.xl{width:120px;height:120px;font-size:44px}
.av-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.av-grid button{font-size:30px;padding:8px 2px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.av-grid button[aria-pressed=true]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--surface))}
.av-grid button:disabled{opacity:.45}
.av-grid small{display:block;font-size:12px;color:var(--ink-2);font-weight:700}
.friend-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--line)}
.friend-row:first-of-type{border-top:0}
.friend-row .nm{flex:1;min-width:0;font-weight:800}
.friend-row .nm small{display:block;color:var(--ink-2);font-weight:600;font-size:14px}
.friend-row .avatar{width:44px;height:44px;font-size:18px}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px}
.rank-row+.rank-row{margin-top:4px}
.rank-row .pos{width:24px;text-align:center;font-family:var(--display);font-size:18px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rank-row .avatar{width:40px;height:40px;font-size:17px}
.rank-row .nm{flex:1;min-width:0}
.rank-row .nm small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.rank-row .xpv{font-family:var(--display);font-size:18px;color:var(--yellow-d);font-variant-numeric:tabular-nums}
.rank-row.me{background:color-mix(in srgb,var(--blue) 12%,transparent);border:2px solid color-mix(in srgb,var(--blue) 35%,transparent)}

/* admin */
.switch-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--line)}
.switch-row:first-of-type{border-top:0}
.switch-row .dot{width:14px;height:14px;border-radius:50%;background:var(--uc);flex:none}
.switch-row .t{flex:1;min-width:0}
.switch-row .t small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:20px;background:var(--locked);transition:.15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+span{background:var(--green)}
.switch input:disabled{cursor:default}
.switch input:disabled+span{opacity:.45}
.switch input:checked+span::after{left:25px}
.switch input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.stu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:2px solid var(--line)}
.stu:first-of-type{border-top:0}
.stu .avatar{width:44px;height:44px;font-size:18px}
.stu .nm{flex:1;min-width:0}
.stu .nm small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.stu .chev{color:var(--ink-2);width:20px}
.bar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.unit-prog{display:flex;align-items:center;gap:10px;padding:8px 0}
.unit-prog .nm{width:110px;font-size:14px}
.unit-prog .bar{flex:1;margin:0}
.unit-prog .v{font-size:13px;color:var(--ink-2);width:40px;text-align:right;font-variant-numeric:tabular-nums}
.hw{border-top:2px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:10px}
.hw:first-of-type{border-top:0;padding-top:4px}
.hw .head{display:flex;align-items:center;gap:10px}
.hw .head .nm{flex:1;min-width:0}
.hw .head small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.hw .head .avatar{width:40px;height:40px;font-size:17px}
.profile .avatar{width:64px;height:64px;font-size:26px}
.pill{white-space:nowrap}
.grade-badge{background:var(--ok-ink);color:var(--surface);border-radius:12px;padding:4px 10px;font-size:17px;font-family:var(--display)}
.hw blockquote{margin:0;background:var(--surface-2);border-radius:12px;padding:12px;font-size:16px;line-height:1.5}
.form-grid{display:grid;gap:10px}

/* lesson */
#lesson,#result{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lwrap{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.ltop{display:flex;align-items:center;gap:12px;padding:12px 16px}
.ltop .x{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}
.ltop .x svg{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:10px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--green);border-radius:10px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.lbody{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:18px}
.lbody.locked{pointer-events:none}
.prompt{font-size:24px}
.lfoot{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:10px}
.lfoot.ok{background:var(--ok-bg);border-color:transparent}
.lfoot.bad{background:var(--bad-bg);border-color:transparent}
.lfoot.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.fb{display:flex;flex-direction:column;gap:2px;font-size:15px}
.fb:empty{display:none}
.fb strong{font-family:var(--display);font-size:22px;font-weight:600}
.lfoot.ok .fb{color:var(--ok-ink)} .lfoot.bad .fb{color:var(--bad-ink)}
.pic{display:grid;place-items:center;line-height:1}
.pic.emoji{font-size:64px}
.pic.xl.emoji{font-size:110px}
.pic.sm.emoji{font-size:46px}
.pic .sw{width:70px;height:70px;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);border:2px solid var(--line);box-sizing:border-box}
.pic.xl .sw{width:120px;height:120px}
.pic.sm .sw{width:48px;height:48px}
.pic .num{font-family:var(--display);font-weight:700;font-size:64px;color:var(--blue)}
.pic.xl .num{font-size:120px}
.pic.sm .num{font-size:44px}
.pic.mas .mascot{width:120px}
.flash{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.flash .word{font-family:var(--display);font-size:40px;font-weight:600}
.flash .es{color:var(--ink-2);font-size:18px}
.audio-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.abtn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 4px 0 var(--blue-d);font-size:15px}
.abtn svg{width:22px;height:22px}
.abtn.slow{background:var(--surface);color:var(--blue);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.abtn.big{padding:22px;border-radius:24px;margin:0 auto}
.abtn.big svg{width:48px;height:48px}
.opts{display:grid;gap:10px}
.opts.grid2{grid-template-columns:1fr 1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 0 var(--line);font-size:18px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;transition:transform .06s}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--surface));box-shadow:0 4px 0 var(--blue);color:var(--blue)}
.opt.tile{min-height:120px}
.opt.good{border-color:var(--green);background:var(--ok-bg);box-shadow:0 4px 0 var(--green);color:var(--ok-ink)}
.opt.wrong{border-color:var(--red);background:var(--bad-bg);box-shadow:0 4px 0 var(--red);animation:shake .3s}
.opt.done{opacity:.35;pointer-events:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .opt{min-height:74px}
.hero-pic{display:flex;align-items:center;justify-content:center;gap:14px}
.sentence{font-family:var(--display);font-size:28px;font-weight:600;text-align:center}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--blue);color:var(--blue);padding:0 6px}
.answer-line{min-height:62px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wchip{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:9px 14px;box-shadow:0 3px 0 var(--line);font-size:18px}
.wchip.used{visibility:hidden}
.extra-badge{align-self:flex-start;background:color-mix(in srgb,var(--yellow) 30%,var(--surface));color:var(--ink);border:2px solid var(--yellow);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:800;flex-shrink:0}
.extra-badge.first{border-radius:14px;animation:pop .35s}
.fix-line{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fix-line .wchip.sel{border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.chat-row{display:flex;align-items:center;gap:12px}
.chat-face{width:84px;height:84px;flex:none}
.chat-face svg{width:100%;height:100%}
.chat-bubble{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;font-size:18px;line-height:1.3}
.chat-bubble b{flex:1}
.seq-done{display:flex;flex-direction:column;gap:8px;min-height:20px}
.seq-opt{text-align:left;font-size:16px;line-height:1.3}
.seq-opt.used{display:none}
.seq-opt.on{display:flex;gap:10px;align-items:center;border-color:var(--green)}
.seq-n{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-weight:800}
.spell-slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;cursor:pointer}
.spell-slot{display:grid;place-items:center;width:38px;height:46px;border-bottom:4px solid var(--line);font-size:26px;font-weight:800;color:var(--ink)}
.spell-slot.on{border-color:var(--green)}
.spell-tile{min-width:44px;font-size:22px;font-weight:800}
.pop-field{position:relative;height:340px;border-radius:18px;border:2px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 8%,var(--surface)),color-mix(in srgb,var(--blue) 26%,var(--surface)));overflow:hidden;flex-shrink:0;touch-action:manipulation}
.bubble-pop{position:absolute;left:0;top:0;border-radius:50%;padding:0;background:radial-gradient(circle at 32% 28%,#fff 0 10%,color-mix(in srgb,hsl(var(--hue) 90% 80%) 45%,transparent) 11% 70%,color-mix(in srgb,hsl(var(--hue) 80% 60%) 55%,transparent) 100%);border:3px solid hsl(var(--hue) 75% 62%);display:grid;place-items:center;will-change:transform;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bubble-pop .bub-in{display:grid;place-items:center;transition:transform .25s,opacity .25s}
.bubble-pop .bub-boom{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;opacity:0;pointer-events:none}
.bubble-pop.gone{border-color:transparent;background:none;transition:background .2s,border-color .2s}
.bubble-pop.gone .bub-in{transform:scale(1.6);opacity:0}
.bubble-pop.gone .bub-boom{animation:boom .5s ease-out}
@keyframes boom{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}
.bubble-pop.shake{border-color:var(--red)}
.bubble-pop.shake .bub-in{animation:shake .35s}
.pop-score{display:flex;gap:6px;justify-content:center;font-size:26px;margin:-4px 0 2px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

.level-tabs{display:flex;gap:8px;margin:2px 0 14px}
.level-tabs.many{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.level-tabs.many::-webkit-scrollbar{display:none}
.level-tabs.many .lvtab{flex:0 0 96px;scroll-snap-align:center}
.lvtab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);color:var(--ink);font-size:16px;font-weight:800}
.lvtab small{font-size:12px;font-weight:600;color:var(--ink-2)}
.lvtab[aria-pressed="true"]{border-color:var(--green);box-shadow:0 3px 0 var(--green);background:color-mix(in srgb,var(--green) 14%,var(--surface))}
.lvtab.locked{flex-direction:row;justify-content:center;gap:6px;color:var(--ink-2)}
.lvtab.locked span{display:inline-block;width:18px;height:18px}
:root{--art-paper:#FFFFFF;--art-ink:#2A2230}
.scene{position:relative;width:100%;border-radius:18px;overflow:hidden;border:2px solid var(--line);box-sizing:border-box;line-height:0;touch-action:manipulation}
.scene>svg{width:100%;height:auto;display:block}
.scene,.scene-ui,.scene-es{flex-shrink:0}
.scene .cap{position:absolute;transform:translate(-50%,-50%);background:var(--art-paper);color:var(--art-ink);border:2px solid var(--art-ink);border-radius:8px;padding:2px 6px;font-size:12px;font-weight:800;line-height:1.1;white-space:nowrap;pointer-events:none}
.scene .check{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-size:20px;font-weight:900;line-height:1;pointer-events:none;animation:pop .3s}
.scene .bin{position:absolute;transform:translate(-50%,-50%);width:44%;height:56%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding-top:6px;background:transparent;border:0;color:var(--art-ink)}
.scene .bin b{font-size:22px;font-weight:900;line-height:1.1;background:var(--art-paper);border:2.5px solid var(--art-ink);border-radius:12px;padding:3px 10px}
.scene .bin .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:0 8px}
.scene .gchip{background:var(--art-paper);border:2px solid var(--green);border-radius:10px;padding:3px 7px;font-size:13px;font-weight:800;line-height:1.1}
.panels{display:flex;flex-direction:column;gap:12px}
.scene.panel .bubble{position:absolute;left:3%;right:3%;top:3%;display:flex;align-items:center;gap:8px;background:var(--art-paper);color:var(--art-ink);border:2.5px solid var(--art-ink);border-radius:16px;padding:8px 10px;line-height:1.25;box-sizing:border-box}
.scene.panel .bubble .n{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--art-ink);color:var(--art-paper);font-size:13px;font-weight:800}
.scene.panel .bubble .tx{flex:1;min-width:0}
.scene.panel .bubble .abtn{flex:none;justify-content:center;width:46px;height:46px;min-width:0;padding:0;border-radius:50%}
.scene.panel .bubble .en{font-size:16px;font-weight:800}
.scene.panel .bubble .es{font-size:13px;opacity:.75}
.scene.panel.on{outline:4px solid var(--yellow);outline-offset:2px}
.scene .spot,.scene .target,.scene .numbox{position:absolute;transform:translate(-50%,-50%)}
.scene .spot{display:flex;align-items:center;justify-content:center;width:24%;height:13%;padding:0 4px;border-radius:999px;background:var(--art-paper);border:2.5px dashed var(--art-ink);color:var(--art-ink);font-size:13px;font-weight:800;line-height:1;box-sizing:border-box;white-space:nowrap}
.scene .spot .lab{position:absolute;left:-7px;top:-9px;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--art-ink);color:var(--art-paper);font-size:12px}
.scene .spot.ok{border-style:solid;border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 35%,transparent)}
.scene .spot.ok .lab{background:var(--green)}
.scene .target{border-radius:50%;background:transparent;border:0;padding:0}
.scene .target.ok{outline:5px solid var(--green);outline-offset:-2px}
.scene .numbox{display:grid;place-items:center;width:8%;aspect-ratio:1;background:var(--art-paper);border:2.5px solid var(--art-ink);border-radius:6px;color:var(--art-ink);font-size:17px;font-weight:800;line-height:1;pointer-events:none}
.scene .shake{animation:scshake .35s}
@keyframes scshake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 7px),-50%)}75%{transform:translate(calc(-50% + 7px),-50%)}}
.scene-es{margin:-6px 0 10px;font-size:15px}
.scene-ui{margin-top:14px}
.deck{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{position:relative;height:150px;perspective:700px;cursor:pointer}
.dback,.dface{position:absolute;inset:0;border-radius:16px;border:3px solid var(--art-ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s;display:grid;place-items:center}
.dback{background:repeating-linear-gradient(45deg,hsl(var(--hue) 75% 60%) 0 10px,hsl(var(--hue) 75% 52%) 10px 20px)}
.dback span{width:58px;height:58px;border-radius:50%;background:var(--art-paper);color:var(--art-ink);display:grid;place-items:center;font-size:32px;font-weight:800;border:3px solid var(--art-ink)}
.dface{background:var(--surface);color:var(--ink);transform:rotateY(180deg);align-content:center;gap:2px;padding:6px;text-align:center}
.dface b{font-size:18px}
.dface small{font-size:14px;color:var(--ink-2)}
.dface .abtn{position:absolute;right:6px;top:6px;width:40px;height:40px;min-width:0;padding:0;justify-content:center;border-radius:50%}
.dcard.up .dback{transform:rotateY(-180deg)}
.dcard.up .dface{transform:rotateY(0)}
.deck.quiz .dface b,.deck.quiz .dface .abtn{display:none}
.deck.quiz .dcard.good .dface{border-color:var(--green);box-shadow:0 0 0 4px var(--green)}
.dcard.shake{animation:shake .35s}
.deck-ask{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font-size:18px}
.deck-ask b{font-size:22px;color:var(--ink)}
.deck-ask .abtn{width:44px;height:44px;min-width:0;padding:0;justify-content:center;border-radius:50%}
.story-opts{margin-top:8px}
.opt.shake{animation:shake .35s;border-color:var(--red)}
.stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:2px solid var(--line);box-sizing:border-box;line-height:0;background:var(--surface)}
.stage.shake{animation:shake .4s}
.stage-bg{position:absolute;inset:0}
.stage-bg svg{width:100%;height:100%}
.stage-bg.fade{animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.actor{position:absolute;bottom:4%;left:-40%;width:36%;aspect-ratio:1;transition:left .6s cubic-bezier(.3,1.35,.6,1);filter:drop-shadow(0 5px 0 rgba(0,0,0,.18));transform-origin:50% 100%}
.actor svg{width:100%;height:100%}
.actor.idle{animation:breathe 2.6s ease-in-out infinite}
.actor.talk{animation:talk .42s ease-in-out infinite}
.actor.jump{animation:hop .55s ease-out 2}
.actor.tilt{animation:tilt .8s ease-in-out}
@keyframes talk{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5%) scale(1.04,.96)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-20%)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}}
.stage-props{position:absolute;inset:0;pointer-events:none}
.prop{position:absolute;font-size:46px;line-height:1;animation:propIn .5s cubic-bezier(.3,1.6,.6,1) both,floaty 2.4s ease-in-out infinite}
@keyframes propIn{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -10px}}
.stage-bubble{position:absolute;left:3%;right:3%;top:3%;display:flex;align-items:center;gap:8px;background:var(--art-paper);color:var(--art-ink);border:2.5px solid var(--art-ink);border-radius:16px;padding:8px 10px;line-height:1.3;box-sizing:border-box;z-index:3;animation:pop .3s}
.stage-bubble::after{content:'';position:absolute;bottom:-12px;left:var(--tail,50%);width:18px;height:18px;background:var(--art-paper);border-right:2.5px solid var(--art-ink);border-bottom:2.5px solid var(--art-ink);transform:translateX(-50%) rotate(45deg)}
.stage-bubble .tx{flex:1;min-width:0}
.stage-bubble .en{font-size:16px;font-weight:800;min-height:21px}
.stage-bubble .es{font-size:13px;opacity:.75}
.stage-bubble .abtn{flex:none;justify-content:center;width:44px;height:44px;min-width:0;padding:0;border-radius:50%}
.story-dots{display:flex;gap:5px;justify-content:center;margin:10px 0 6px}
.story-dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.story-dots i.on{background:var(--green)}
.story-ctl{display:flex;gap:10px;justify-content:space-between;margin:8px 0 10px}
.story-ctl .btn{flex:1}
.story-quiz{background:var(--surface);border:2px solid var(--yellow);border-radius:16px;padding:12px;text-align:center;animation:pop .3s}
.story-quiz b{font-size:19px}
.story-quiz p{margin:6px 0 10px;font-size:17px;font-weight:700}
.who-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.who-btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 3px 0 var(--line);position:relative;width:96px}
.who-btn span{display:block;width:66px;height:66px}
.who-btn span svg{width:100%;height:100%}
.who-btn small{font-size:14px;font-weight:700;color:var(--ink)}
.who-btn.shake{animation:shake .35s;border-color:var(--red)}
.who-row.big .who-btn{width:42%;max-width:150px}
.chant-row{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;cursor:pointer}
.chant-row.on{background:color-mix(in srgb,var(--green) 14%,transparent);border-radius:10px}
.game-field{position:relative;border-radius:18px;border:2px solid var(--line);overflow:hidden;flex-shrink:0;touch-action:none;margin-bottom:10px}
.basket-field{height:300px;background:linear-gradient(180deg,#BFE3FA 0 78%,#7DD08D 78%)}
.faller{position:absolute;left:0;top:0;width:58px;height:58px;border-radius:50%;background:var(--art-paper);border:3px solid var(--art-ink);display:grid;place-items:center;will-change:transform}
.faller .pic.sm.emoji{font-size:34px}
.faller svg{width:40px;height:40px}
.faller.caught{opacity:0;transition:opacity .3s}
.bask{position:absolute;left:0;bottom:6px;font-size:58px;line-height:1;transition:transform .12s;pointer-events:none}
.bask-arrows{display:flex;justify-content:center;gap:16px;margin-bottom:8px}
.bask-arrows .btn{min-width:90px;font-size:22px}
.cups-field{height:220px;background:linear-gradient(180deg,#FFE9C7 0 70%,#B9824F 70%)}
.cup-slot{position:absolute;top:22%;width:26%;height:66%;padding:0;background:none;border:0;transition:left .3s ease-in-out;cursor:pointer}
.cup-pic{position:absolute;left:0;right:0;bottom:6%;display:grid;place-items:center}
.cup-pic .pic.sm.emoji{font-size:40px}
.cup-pic svg{width:46px;height:46px}
.cup{position:absolute;left:4%;right:4%;bottom:0;height:88%;background:hsl(var(--hue) 75% 58%);border:3px solid var(--art-ink);clip-path:polygon(14% 0,86% 0,100% 100%,0 100%);border-radius:6px;transform:translateY(-105%);transition:transform .35s ease-out}
.cup-slot.down .cup{transform:translateY(0)}
.goal-field{height:230px;background:linear-gradient(180deg,#BFE3FA 0 55%,#5DBB63 55%)}
.goal-net{position:absolute;left:4%;right:4%;top:8%;height:52%;border:6px solid #FFFFFF;border-bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 12px);pointer-events:none}
.goal-zone{position:absolute;top:16%;width:28%;height:38%;z-index:2;border-radius:12px;border:3px dashed rgba(42,34,48,.45);background:rgba(255,255,255,.55);color:var(--art-ink);font-size:16px;font-weight:800;padding:4px;cursor:pointer}
.goal-zone.aim{border-style:solid;border-color:var(--art-ink)}
.keeper{position:absolute;left:50%;top:30%;width:66px;transform:translateX(-50%);transition:left .4s ease-out;z-index:3;pointer-events:none}
.ball{position:absolute;left:50%;top:80%;font-size:34px;transform:translate(-50%,-50%);transition:left .45s ease-out,top .45s ease-out,font-size .45s;z-index:4;pointer-events:none}
.ball.kicked{top:36%;font-size:24px}
.goal-shout{position:absolute;left:0;right:0;top:62%;text-align:center;font-family:var(--display);font-size:32px;font-weight:800;color:#fff;-webkit-text-stroke:1.5px var(--art-ink);opacity:0;transform:scale(.6);transition:.3s;z-index:5;pointer-events:none}
.goal-shout.on{opacity:1;transform:scale(1)}
.goal-shout.bad{color:#FFC83D}
.chests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.chest{position:relative;height:150px;padding:0;background:none;border:0;cursor:pointer}
.chest-box{position:absolute;left:6%;right:6%;bottom:28px;height:56px;background:#B9824F;border:3px solid var(--art-ink);border-radius:6px 6px 10px 10px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.15)}
.chest-lid{position:absolute;left:4%;right:4%;bottom:82px;height:34px;background:#C9925F;border:3px solid var(--art-ink);border-radius:18px 18px 4px 4px;transform-origin:10% 100%;transition:transform .4s ease-out;z-index:2}
.chest-in{position:absolute;left:0;right:0;bottom:60px;text-align:center;font-size:34px;opacity:0;transition:opacity .3s .2s,transform .4s .2s}
.chest-tag{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:16px;font-weight:800;color:var(--ink)}
.chest.open .chest-lid{transform:rotate(-38deg) translateY(-6px)}
.chest.open .chest-in{opacity:1;transform:translateY(-58px) scale(1.25)}
.chest-box::after{content:'';position:absolute;left:50%;top:-4px;width:18px;height:20px;transform:translateX(-50%);background:#FFC83D;border:3px solid var(--art-ink);border-radius:4px}
.chest-in{z-index:3}
.spark{position:absolute;left:50%;top:40%;font-size:20px;pointer-events:none;animation:spark .7s ease-out forwards}
@keyframes spark{0%{transform:translate(-50%,-50%) rotate(var(--a)) translateY(0);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--a)) translateY(-60px);opacity:0}}
.train-line{position:relative;padding-left:4px;border-top:0;border-bottom:4px dashed var(--ink-2);flex-wrap:wrap;transition:transform 1.1s ease-in}
.train-line .engine{font-size:40px;line-height:1;transform:scaleX(-1);order:99;margin-left:-4px}
.wagon{background:color-mix(in srgb,var(--blue) 18%,var(--surface));border-color:var(--blue);border-radius:10px 10px 4px 4px;position:relative}
.wagon::before,.wagon::after{content:'';position:absolute;bottom:-9px;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--surface)}
.wagon::before{left:8px}.wagon::after{right:8px}
.train-line.go{transform:translateX(130%);opacity:0;transition:transform 1.1s ease-in,opacity 1.1s ease-in}
.play-field{position:relative;height:330px;border-radius:18px;border:2px solid var(--line);overflow:hidden;flex-shrink:0;touch-action:manipulation;margin-bottom:12px}
.play-field.parade{background:linear-gradient(180deg,#BFE3FA 0 40%,#9FD58C 40%)}
.play-field .lane{position:absolute;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,#8C96A8 0 26px,#6E7788 26px 52px);border-top:3px solid #2A2230;border-bottom:3px solid #2A2230}
.play-field.rain{background:radial-gradient(circle at 15% 20%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 70% 12%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 45% 40%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 85% 55%,#fff 0 1.5px,transparent 2px),linear-gradient(180deg,#1B2B5A,#4A67B8)}
.play-field.moles{background:linear-gradient(180deg,#BFE3FA 0 22%,#7DD08D 22%)}
.mover{position:absolute;left:0;top:0;border-radius:50%;padding:0;background:var(--art-paper);border:3px solid var(--art-ink);display:grid;place-items:center;will-change:transform;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.mover .bub-in{display:grid;place-items:center;transition:transform .25s,opacity .25s}
.mover .bub-in svg{width:52px;height:52px}
.mover .bub-in.shake{animation:shake .35s}
.mover .bub-boom{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;opacity:0;pointer-events:none}
.mover.gone{background:none;border-color:transparent;box-shadow:none}
.mover.gone .bub-in{transform:scale(1.6);opacity:0}
.mover.gone .bub-boom{animation:boom .5s ease-out}
.rain .mover::before{content:'';position:absolute;left:50%;top:-22px;width:2px;height:22px;background:var(--art-ink)}
.rain .mover::after{content:'';position:absolute;left:50%;top:-46px;width:56px;height:28px;transform:translateX(-50%);border-radius:28px 28px 4px 4px;background:hsl(var(--hue) 80% 62%);border:3px solid var(--art-ink)}
.hole{position:absolute;width:28%;height:34%;overflow:hidden}
.hole::after{content:'';position:absolute;left:4%;right:4%;bottom:0;height:22%;background:#6B4A33;border:3px solid #2A2230;border-radius:50%;z-index:2}
.hole .mover{left:50%;top:auto;bottom:8%;transform:translate(-50%,115%);transition:transform .28s ease-out}
.hole .mover.up{transform:translate(-50%,0)}
.play-tray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:46px;margin-bottom:8px}
.tray-it{position:relative;width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--green);display:grid;place-items:center;animation:pop .35s}
.tray-it .pic.sm.emoji{font-size:26px}
.tray-it svg{width:32px;height:32px}
.tray-it b{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--green);color:#fff;font-size:13px;display:grid;place-items:center}
.tray-it.empty{border-style:dashed;border-color:var(--line);animation:none}
.scene-bank .wchip{touch-action:none;font-weight:700}
.scene-bank .wchip.sel{border-color:var(--blue);box-shadow:0 3px 0 var(--blue)}
.wchip.ghost{position:fixed;transform:translate(-50%,-50%) scale(1.08);pointer-events:none;z-index:60;border-color:var(--blue)}
.scene-listen{display:flex;align-items:center;gap:14px}
.scene-listen .mic{width:72px;height:72px;margin:0;flex:none;background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.scene-listen .speak-status{text-align:left}
.tip-row.on{background:color-mix(in srgb,var(--yellow) 28%,transparent);border-radius:12px}
.write-in{font-family:var(--display);font-size:26px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;width:100%;box-sizing:border-box;letter-spacing:.04em}
.hint{text-align:center;color:var(--ink-2);font-size:15px}
.mic{width:110px;height:110px;border-radius:50%;background:var(--red);color:#fff;box-shadow:0 6px 0 var(--red-d);display:grid;place-items:center;margin:0 auto}
.mic svg{width:50px;height:50px}
.mic.on{animation:pulse 1s infinite}
.speak-status{text-align:center;font-size:16px;color:var(--ink-2);min-height:22px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{aspect-ratio:3/4;border-radius:14px;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:15px;font-weight:600;padding:4px;max-width:100%;text-align:center;overflow:hidden;word-break:break-word}
.mcard .back{font-size:26px;opacity:.9}
.mcard.up{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.mcard.ok{background:var(--ok-bg);border:2px solid var(--green);box-shadow:0 4px 0 var(--green);color:var(--ok-ink)}
.mcard .pic.emoji{font-size:34px}
.mcard .pic .sw{width:36px;height:36px}
.mcard .pic .num{font-size:36px}
.story{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.story h3{font-size:22px}
.story p{margin:0;font-size:18px;line-height:1.6;font-weight:600}
.story .es-t{color:var(--ink-2);font-size:15px}
.linkbtn{color:var(--blue);font-size:15px;text-decoration:underline;align-self:flex-start;padding:2px 0}
.tip{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:6px 16px}
.tip-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:2px solid var(--line)}
.tip-row:first-child{border-top:0}
.tip-row .en{font-family:var(--display);font-size:22px;font-weight:600}
.tip-row .es{color:var(--ink-2);font-size:15px}
.tip-row .t{flex:1}
.tip-row .abtn{padding:8px 10px}
.tip-row.heard .en::after{content:' ✓';color:var(--green)}
.tip-quiz{margin-top:14px;padding:12px;border:2px solid var(--yellow);border-radius:20px;background:var(--surface);animation:pop .3s}
.tip-quiz h3{margin:0 0 8px;font-size:19px}
#result .lwrap{box-sizing:border-box;justify-content:center;padding:24px 20px;gap:18px;text-align:center;overflow-y:auto}
#result h1{font-size:clamp(26px,8vw,34px);color:var(--yellow-d);overflow-wrap:anywhere}
#result .lwrap>*{min-width:0;max-width:100%}
.big-stars{display:flex;justify-content:center;gap:6px}
.big-stars svg{width:54px;height:54px}
.big-stars span:nth-child(2){transform:translateY(-12px)}
.new-medal{display:flex;align-items:center;gap:12px;text-align:left}
.new-medal .m{width:48px;height:48px;font-size:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--yellow) 30%,transparent);border:3px solid var(--yellow);flex:none}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,18,32,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div>*{flex-shrink:0}
.sheet>div{background:var(--surface);width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.legal{font-size:14px;color:var(--ink-2);text-align:center;margin:12px 0 0;line-height:1.5}
.legal a{color:var(--blue);font-weight:700}
.chip.gem{color:var(--blue)}
.league-badge{font-size:16px}
.league-card{margin:4px 0 14px}
.league-big{font-size:46px;line-height:1}
.review-card{margin-bottom:14px;border-color:var(--purple)}
.gem-earned{font-family:var(--display);font-size:18px;color:var(--blue);font-weight:600}
.streak-up{display:flex;align-items:center;gap:12px;text-align:left;border-color:var(--orange)}
.streak-up .flame{font-size:40px;animation:bob 1.2s ease-in-out infinite}
.friend-row .nm small.duel{color:var(--blue);font-weight:700}
.gem-balance{font-family:var(--display);font-size:22px;color:var(--blue)}
.shop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shop-item{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:center;background:var(--surface)}
.shop-item .g{font-size:36px}
.shop-item small{color:var(--ink-2);font-size:13px;line-height:1.35}
.shop-item.owned{border-color:var(--green)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;border-radius:2px;animation:confetti-fall 2s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes confetti-fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:60;font-size:15px;max-width:calc(100% - 48px);text-align:center}


/* groups & tasks */
.group-bar{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--purple) 10%,var(--surface));border:2px solid color-mix(in srgb,var(--purple) 30%,transparent);border-radius:14px;padding:8px 12px}
.group-bar .lbl{color:var(--purple);flex:none}
.group-bar select{flex:1;min-width:0;border:0;background:transparent;padding:6px 4px;font-weight:800;color:var(--ink)}
.cbrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px;cursor:pointer}
.cbrow input{width:20px;height:20px;accent-color:var(--purple);flex:none}
.field label.cbrow{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink)}
.cbrow small{margin-left:auto;color:var(--ink-2);font-weight:600;font-size:12px}
input[type=date].in{min-height:50px}
/* editor */
.ed-back{color:var(--purple);font-size:15px;display:inline-flex;align-items:center;gap:2px;margin-bottom:12px;padding:4px 0}
.ed-back svg{width:20px;height:20px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:2px solid var(--line);background:none;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main .t1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{display:block;color:var(--ink-2);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--uc,var(--purple)) 16%,transparent);color:var(--uc,var(--purple));flex:none}
.c-yellow .row .ico,.row.c-yellow .ico{color:#9A6B00}
.row .ico svg{width:21px;height:21px}
.tools{display:flex;gap:4px;flex:none}
.mini{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);border:2px solid var(--line);background:var(--surface);flex:none}
.mini svg{width:16px;height:16px}
.mini:disabled{opacity:.3;cursor:default}
.mini.danger{color:var(--red)}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-card{border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 0 var(--line)}
.type-card span{width:26px;height:26px;color:var(--purple)}
.type-card b{font-size:15px}
.type-card small{font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.3}
.wpick{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow-y:auto;padding:2px}
.wtag{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:4px 10px 4px 6px;background:var(--surface);font-size:15px}
.wtag .pic.emoji{font-size:22px}
.wtag .pic .sw{width:20px;height:20px}
.wtag .pic .num{font-size:20px}
.wtag .pic img.up{width:24px;height:24px;border-radius:6px}
.wtag[aria-pressed="true"]{border-color:var(--purple);background:color-mix(in srgb,var(--purple) 14%,var(--surface));color:var(--purple)}
.wprev{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none;overflow:hidden}
.wprev .pic.emoji{font-size:32px}
.wprev .pic .sw{width:30px;height:30px}
.wprev .pic .num{font-size:30px}
.wprev .pic img.up{width:52px;height:52px;border-radius:0}
.wprev .pic.mas .mascot{width:48px}
.wprev.big{width:120px;height:120px;border-radius:24px}
.wprev.big .pic.emoji{font-size:72px}
.wprev.big .pic .sw{width:70px;height:70px}
.wprev.big .pic img.up{width:120px;height:120px}
select.in{appearance:auto;min-width:0}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;background:var(--uc);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.pic img.up{width:70px;height:70px;object-fit:cover;border-radius:16px}
.pic.xl img.up{width:150px;height:150px;border-radius:24px}
.pic.sm img.up{width:48px;height:48px;border-radius:10px}
.mcard .pic img.up{width:44px;height:44px;border-radius:8px}
.tip-edit{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.tip-edit .in{font-size:15px;padding:10px}
.preview-banner{background:var(--purple);color:#fff;text-align:center;font-size:12px;padding:5px;letter-spacing:.08em}
.field input:disabled{opacity:.6}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>

const rnd = a => a[Math.floor(Math.random() * a.length)];

const dayKey = (back = 0) => { const d = new Date(); d.setDate(d.getDate() - back); return ymd(d); };
const today = () => dayKey(0);
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const endMark = t => /[.?!]$/.test(t) ? t : t + (/^(what|where|who|how|is|are|do|does|can|have|has)\b/i.test(t) ? '?' : '.');
const AV_COLORS = ['#1E6FD9','#2FA84F','#E8352E','#8E44C9','#FF8A1F','#0FA3A3','#D63384'];

const AV = {

const AV_DEFAULT = {v:2, skin:1, hair:'short', hc:1, eyes:'normal', mouth:'smile', top:'tee', tc:4, head:'none', face:'none', bg:0};

const avIdx = (list, i) => (Number.isInteger(i) && i >= 0 && i < list.length) ? i : 0;
function avNorm(a){

let voice = null;
function voiceScore(v){
  let n = 0;
  if (/^en[-_]US$/i.test(v.lang)) n += 50; else if (/^en/i.test(v.lang)) n += 30; else return -1;
  if (/\bana\b/i.test(v.name)) n += 45; // voz de niña (Edge y Windows con voces en línea)
  if (/samantha|ava|allison|aria|jenny|emma|michelle|ana|google us/i.test(v.name)) n += 25;
  if (/enhanced|premium|natural|neural|online/i.test(v.name)) n += 15;
  if (/david|mark|george|james|guy/i.test(v.name)) n -= 20; // voces de hombre: para niños suena mejor una voz aguda
  if (/zira|hazel/i.test(v.name)) n -= 5; // voces de Windows sin conexión: se oyen robóticas
  if (/compact|espeak|robot|novelty|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|pipe organ|trinoids|whisper|zarvox|albert|fred|junior|kathy|ralph/i.test(v.name)) n -= 40;
  if (v.localService) n += 3;
  return n;
}

const kidVoice = v => !!v && /\bana\b/i.test(v.name);
function pickVoice(){

  if (mine){ voice = mine; return; }
  try { voice = speechSynthesis.getVoices().map(v => [voiceScore(v), v]).filter(x => x[0] >= 0).sort((a, b) => b[0] - a[0]).map(x => x[1])[0] || null; } catch (e) {}
}

const CAST_KIND = {Charlie:'boy', Kim:'boy', Harry:'boy', Cody:'boy', Oliver:'boy', Rose:'girl', Beth:'girl', Katy:'girl', Sophie:'girl',
  'Uncle Dan':'man', 'Captain Conrad':'man', 'Uncle James':'man', 'Finley Keen':'man', 'Aunt Fifi':'woman', 'President Pop':'woman',
  'PROD 1':'robot', 'PROD 2':'robot', Ola:'monkey', Coco:'monkey', Waldo:'dragon'};
const VOICE_KIND = {girl:{g:'f', pitch:1.6, rate:1, alt:2}, boy:{g:'m', pitch:1.8, rate:1.03, alt:1.15}, woman:{g:'f', pitch:1.1, rate:0.95, alt:1.3},
  man:{g:'m', pitch:0.95, rate:0.92, alt:0.7}, robot:{g:'m', pitch:0.4, rate:0.85, alt:0.3}, monkey:{g:'f', pitch:2, rate:1.15, alt:2}, dragon:{g:'m', pitch:0.6, rate:0.85, alt:0.4}};
const FEM_RE = /female|zira|hazel|susan|samantha|\bava\b|allison|aria|jenny|emma|michelle|\bana\b|joanna|salli|kimberly|ivy|libby|sonia|natasha|clara|karen|moira|tessa|fiona|victoria|google us english/i;
const MALE_RE = /\bmale\b|david|mark|george|james|guy|daniel|\balex\b|\btom\b|ryan|eric|christopher|brian|andrew|roger|steffan|liam|william|google uk english male/i;
function castVoice(name){

function say(text, slow, done, who){
  try {
    if (!('speechSynthesis' in window)){ if (!ttsWarned){ ttsWarned = true; toast('Este teléfono no puede reproducir voz. Pide ayuda a tu profe.'); } return; }

let actx = null;
function sfx(ok){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();

      const o = actx.createOscillator(), g = actx.createGain();

      const t = actx.currentTime + i * 0.12;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(ok ? 0.18 : 0.06, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

    });
  } catch (e) {}
}

// Compara lo que escuchó el micrófono con la frase, con tolerancia para niños (plural, una letra distinta, homófonos).
const SOUNDS_LIKE = {four:'for', to:'two', too:'two', ate:'eight', won:'one', its:'it', hi:'hello', yeah:'yes', ok:'okay', mom:'mum', color:'colour', grey:'gray'};
function wordKey(w){ w = SOUNDS_LIKE[w] || w; return w.length > 3 ? w.replace(/(es|s)$/, '') : w; }
function lev(a, b){ const d = Array.from({length:b.length + 1}, (_, i) => i); for (let i = 1; i <= a.length; i++){ let prev = d[0]; d[0] = i; for (let j = 1; j <= b.length; j++){ const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; } } return d[b.length]; }

function speechScore(target, heard){
  const tw = norm(target).split(' ').filter(Boolean); if (!tw.length) return 1;
  return Math.max(0, ...heard.map(t => { const hw = norm(t).split(' ').filter(Boolean); return tw.filter(w => hw.some(x => sameWord(w, x))).length / tw.length; }));
}
function micErrorMsg(er){

  if (er === 'no-speech') return 'No te escuché. Acércate al teléfono e inténtalo otra vez.';
  if (er === 'network') return 'Sin internet no puedo escuchar.';

}

function shrinkImage(file, cb){

    const S2 = 240, c = document.createElement('canvas'); c.width = c.height = S2;
    const k = Math.max(S2 / im.width, S2 / im.height), w = im.width * k, hh = im.height * k;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, S2, S2); g.drawImage(im, (S2 - w) / 2, (S2 - hh) / 2, w, hh);
    cb(c.toDataURL('image/jpeg', 0.8));
  }; im.onerror = () => toast('No pude leer esa imagen. Prueba con otra.'); im.src = fr.result; };
  fr.readAsDataURL(file);
}

}

function dragify(el, onDrop){
  el.addEventListener('pointerdown', e => {
    const sx = e.clientX, sy = e.clientY; let ghost = null;
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
      if (!ghost){ ghost = el.cloneNode(true); ghost.classList.add('ghost'); document.body.append(ghost); }
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; ev.preventDefault();
    };
    const up = ev => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      if (!ghost) return;
      ghost.remove(); el.dataset.dragged = '1'; setTimeout(() => delete el.dataset.dragged, 60);
      onDrop(document.elementFromPoint(ev.clientX, ev.clientY));
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  });
}

const STOP = new Set(['the','and','you','are','can','yes','not','she','his','her','they','what','this','that','there','have','has','with','for','like','look','let','now','one','too','very','here','see','say']);
function vocabIn(text){
  const t = ' ' + String(text).toLowerCase().replace(/[^a-z' ]/g, ' ') + ' ', out = [];
  Object.keys(V).filter(k => k.length >= 3 && !STOP.has(k.toLowerCase())).sort((a, b) => b.length - a.length).forEach(k => {
    if (out.length >= 3) return;
    const kk = ' ' + k.toLowerCase() + ' ';
    if (t.includes(kk) && !out.some(o => o.toLowerCase().includes(k.toLowerCase()))) out.push(k);

}

  };

    show(b, who, sp, text, sing, shown){

      // globo que se escribe solo, con la cola hacia quien habla
      const k = who.indexOf(sp); bub.hidden = false; bub.style.setProperty('--tail', (k < 0 ? 50 : spots[k] + 16) + '%');
      au.innerHTML = ''; au.append(audioBtn(text, false, true, sp));
      const my = ++typing; let c = 0; en.textContent = '';

  };

const clean = t => String(t || '').replace(/\s+/g, ' ').trim();
