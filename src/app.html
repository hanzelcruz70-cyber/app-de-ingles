<title>Pandi English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-width column; login first, then student app (map path) or admin panel; lesson player on top */
:root{
  --bg:#F1F6FD; --surface:#FFFFFF; --surface-2:#E6EEF9; --ink:#14233B; --ink-2:#5A6B85; --line:#D5E0EF;
  --red:#E8352E; --red-d:#B92620; --yellow:#FFC531; --yellow-d:#C98F00; --blue:#1E6FD9; --blue-d:#1453A8;
  --green:#2FA84F; --green-d:#1F7F39; --purple:#8E44C9; --purple-d:#6A2C9E; --orange:#FF8A1F;
  --locked:#C9D3E1; --locked-d:#A9B5C6; --ok-bg:#DDF5E3; --bad-bg:#FDE3E1; --ok-ink:#1F7F39; --bad-ink:#B92620;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --surface:#17223A; --surface-2:#1F2D4A; --ink:#EAF1FF; --ink-2:#9FB0CC; --line:#2A3A5A;
  --locked:#334360; --locked-d:#24314A; --ok-bg:#143823; --bad-bg:#3D1A1A; --ok-ink:#6EE08F; --bad-ink:#FF8A80; --yellow-d:#FFC531; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#17223A; --surface-2:#1F2D4A; --ink:#EAF1FF; --ink-2:#9FB0CC; --line:#2A3A5A;
  --locked:#334360; --locked-d:#24314A; --ok-bg:#143823; --bad-bg:#3D1A1A; --ok-ink:#6EE08F; --bad-ink:#FF8A80; --yellow-d:#FFC531; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;font-weight:700;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
[hidden]{display:none!important}
.screen[hidden]{display:none!important}
.mascot{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

.c-blue{--uc:var(--blue);--ucd:var(--blue-d);--uink:#fff}
.c-green{--uc:var(--green);--ucd:var(--green-d);--uink:#fff}
.c-red{--uc:var(--red);--ucd:var(--red-d);--uink:#fff}
.c-yellow{--uc:var(--yellow);--ucd:#C98F00;--uink:#14233B}
.c-purple{--uc:var(--purple);--ucd:var(--purple-d);--uink:#fff}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:16px;
  font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.02em;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn:disabled{background:var(--locked);box-shadow:0 4px 0 var(--locked-d);color:var(--ink-2);cursor:default}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.ghost{background:var(--surface);color:var(--blue);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.small{font-size:16px;padding:10px 14px;border-radius:13px}
.btn.blue:disabled,.btn.ghost:disabled{background:var(--locked);box-shadow:0 4px 0 var(--locked-d);color:var(--ink-2);border-color:transparent}
.node-wrap.has-tag{margin-top:34px}

/* login */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:28px 20px}
.brand{font-family:var(--display);font-size:32px;font-weight:700;text-align:center;letter-spacing:.01em}
.brand span{color:var(--green)} .brand i{font-style:normal;color:var(--blue)}
.hero-panda{width:150px;margin:0 auto;animation:bob 2.6s ease-in-out infinite}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 18px;font-size:17px;text-align:center}
.bubble b{font-family:var(--display);font-size:23px;font-weight:600;display:block;color:var(--green)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.in,textarea{font:inherit;font-size:18px;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.err{color:var(--bad-ink);background:var(--bad-bg);border-radius:12px;padding:10px 12px;font-size:15px;margin:0}
.demo{border:2px dashed var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.demo-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.demo-row .r{flex:1;min-width:0}
.demo-row small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.demo-row .tag{font-size:12px;letter-spacing:.06em;padding:4px 8px;border-radius:9px;color:#fff;background:var(--green)}
.demo-row .tag.adm{background:var(--purple)}

/* top bar + tabs */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg);border-bottom:2px solid var(--line)}
.topbar .logo{width:42px;flex:none}
.topbar .name{font-family:var(--display);font-size:20px;font-weight:700;flex:1;min-width:0}
.topbar .name span{color:var(--green)}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.chip svg{width:22px;height:22px}
.chip.fire{color:var(--orange)} .chip.xp{color:var(--yellow-d)}
.topbar .name .role-pill{color:#fff}
.role-pill{font-size:11px;letter-spacing:.1em;background:var(--purple);color:#fff;padding:4px 8px;border-radius:9px;vertical-align:middle;margin-left:6px;font-family:var(--body)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);border:2px solid var(--line);background:var(--surface)}
.iconbtn svg{width:20px;height:20px}
.tab{padding:16px 16px 110px}
.tab[hidden]{display:none}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6;box-sizing:border-box}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12px;color:var(--ink-2)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.nav.adm button[aria-current="page"]{color:var(--purple);background:color-mix(in srgb,var(--purple) 12%,transparent)}

/* map */
.unit-banner{background:var(--uc);color:var(--uink);border-radius:20px;padding:16px 18px;box-shadow:0 4px 0 var(--ucd);display:flex;align-items:center;gap:12px;margin-top:8px}
.unit-banner .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.unit-banner h2{font-size:26px}
.unit-banner p{margin:2px 0 0;font-size:14px;opacity:.92}
.unit-banner .count{margin-left:auto;font-family:var(--display);font-size:18px;background:rgba(255,255,255,.22);padding:6px 10px;border-radius:12px;white-space:nowrap}
.unit-banner.locked{background:var(--surface-2);color:var(--ink-2);box-shadow:0 4px 0 var(--line)}
.unit-banner.locked .count{background:var(--surface)}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:52px 0 30px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.node{width:74px;height:74px;border-radius:50%;background:var(--uc);box-shadow:0 6px 0 var(--ucd);display:grid;place-items:center;color:var(--uink);transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ucd)}
.node svg{width:34px;height:34px}
.node.locked{background:var(--locked);box-shadow:0 6px 0 var(--locked-d);color:var(--ink-2)}
.node.current{outline:6px solid color-mix(in srgb,var(--uc) 30%,transparent);outline-offset:4px;animation:pulse 1.6s ease-in-out infinite}
.node-label{font-size:13px;color:var(--ink-2);text-align:center;line-height:1.2;max-width:130px}
.node-label b{display:block;color:var(--ink);font-size:14px}
.stars{display:flex;gap:1px;justify-content:center}
.stars svg{width:15px;height:15px}
.start-tag{position:absolute;top:-38px;background:var(--surface);border:2px solid var(--line);color:var(--uc);font-family:var(--display);font-weight:600;padding:5px 12px;border-radius:12px;white-space:nowrap;animation:bob 2s ease-in-out infinite;font-size:15px}
.start-tag::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.panda-say{display:flex;gap:10px;align-items:flex-end}
.panda-say .mascot{width:76px;flex:none}
.panda-say .bubble{text-align:left;font-size:16px;flex:1;min-width:0}

.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.section-title{font-size:24px;margin:4px 0 12px}
.muted{color:var(--ink-2);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--line)}
.task:first-of-type{border-top:0}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.check svg{width:18px;height:18px}
.due{display:inline-block;background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);padding:3px 10px;border-radius:10px;font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;background:var(--surface-2);color:var(--ink-2);letter-spacing:.04em}
.pill.warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.pill.okp{background:var(--ok-bg);color:var(--ok-ink)}
.note{background:color-mix(in srgb,var(--green) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:14px;padding:12px}

.profile{display:flex;gap:14px;align-items:center}
.profile .av{width:76px;height:76px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;overflow:hidden}
.profile .av .mascot{width:70px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat span{overflow-wrap:anywhere}
.stats.four{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.medal{text-align:center;padding:12px 6px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.medal .m{width:58px;height:58px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--yellow) 30%,transparent);border:3px solid var(--yellow)}
.medal.off .m{filter:grayscale(1);opacity:.35;border-color:var(--line);background:var(--surface-2)}
.medal b{font-size:13px;display:block;line-height:1.2}
.medal small{font-size:11px;color:var(--ink-2);font-weight:600;display:block;margin-top:3px;line-height:1.25}

/* ranking */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{padding:9px;border-radius:11px;color:var(--ink-2);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:8px;margin:8px 0 18px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .avatar{width:56px;height:56px;font-size:22px}
.pod .name{font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod .block{width:100%;border-radius:14px 14px 6px 6px;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:700;color:#fff}
.pod.p1 .block{height:96px;background:var(--yellow);color:#14233B;box-shadow:0 4px 0 #C98F00}
.pod.p2 .block{height:72px;background:#9DB0C8;box-shadow:0 4px 0 #7D8FA6}
.pod.p3 .block{height:56px;background:#D9874A;box-shadow:0 4px 0 #AF6630}
.pod .pts{font-size:13px;color:var(--ink-2)}
.avatar{border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;color:#fff;flex:none}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px}
.rank-row+.rank-row{margin-top:4px}
.rank-row .pos{width:24px;text-align:center;font-family:var(--display);font-size:18px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rank-row .avatar{width:40px;height:40px;font-size:17px}
.rank-row .nm{flex:1;min-width:0}
.rank-row .nm small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.rank-row .xpv{font-family:var(--display);font-size:18px;color:var(--yellow-d);font-variant-numeric:tabular-nums}
.rank-row.me{background:color-mix(in srgb,var(--blue) 12%,transparent);border:2px solid color-mix(in srgb,var(--blue) 35%,transparent)}

/* admin */
.switch-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--line)}
.switch-row:first-of-type{border-top:0}
.switch-row .dot{width:14px;height:14px;border-radius:50%;background:var(--uc);flex:none}
.switch-row .t{flex:1;min-width:0}
.switch-row .t small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:20px;background:var(--locked);transition:.15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{left:25px}
.switch input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.stu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:2px solid var(--line)}
.stu:first-of-type{border-top:0}
.stu .avatar{width:44px;height:44px;font-size:18px}
.stu .nm{flex:1;min-width:0}
.stu .nm small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.stu .chev{color:var(--ink-2);width:20px}
.bar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.unit-prog{display:flex;align-items:center;gap:10px;padding:8px 0}
.unit-prog .nm{width:110px;font-size:14px}
.unit-prog .bar{flex:1;margin:0}
.unit-prog .v{font-size:13px;color:var(--ink-2);width:40px;text-align:right;font-variant-numeric:tabular-nums}
.hw{border-top:2px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:10px}
.hw:first-of-type{border-top:0;padding-top:4px}
.hw .head{display:flex;align-items:center;gap:10px}
.hw .head .nm{flex:1;min-width:0}
.hw .head small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.hw .head .avatar{width:40px;height:40px;font-size:17px}
.profile .avatar{width:64px;height:64px;font-size:26px}
.pill{white-space:nowrap}
.hw blockquote{margin:0;background:var(--surface-2);border-radius:12px;padding:12px;font-size:16px;line-height:1.5}
.form-grid{display:grid;gap:10px}

/* lesson */
#lesson,#result{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lwrap{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.ltop{display:flex;align-items:center;gap:12px;padding:12px 16px}
.ltop .x{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}
.ltop .x svg{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:10px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--green);border-radius:10px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.lbody{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:18px}
.lbody.locked{pointer-events:none}
.prompt{font-size:24px}
.lfoot{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:10px}
.lfoot.ok{background:var(--ok-bg);border-color:transparent}
.lfoot.bad{background:var(--bad-bg);border-color:transparent}
.lfoot.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.fb{display:flex;flex-direction:column;gap:2px;font-size:15px}
.fb:empty{display:none}
.fb strong{font-family:var(--display);font-size:22px;font-weight:600}
.lfoot.ok .fb{color:var(--ok-ink)} .lfoot.bad .fb{color:var(--bad-ink)}
.pic{display:grid;place-items:center;line-height:1}
.pic.emoji{font-size:64px}
.pic.xl.emoji{font-size:110px}
.pic.sm.emoji{font-size:46px}
.pic .sw{width:70px;height:70px;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.pic.xl .sw{width:120px;height:120px}
.pic.sm .sw{width:48px;height:48px}
.pic .num{font-family:var(--display);font-weight:700;font-size:64px;color:var(--blue)}
.pic.xl .num{font-size:120px}
.pic.sm .num{font-size:44px}
.pic.mas .mascot{width:120px}
.flash{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.flash .word{font-family:var(--display);font-size:40px;font-weight:600}
.flash .es{color:var(--ink-2);font-size:18px}
.audio-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.abtn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 4px 0 var(--blue-d);font-size:15px}
.abtn svg{width:22px;height:22px}
.abtn.slow{background:var(--surface);color:var(--blue);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.abtn.big{padding:22px;border-radius:24px;margin:0 auto}
.abtn.big svg{width:48px;height:48px}
.opts{display:grid;gap:10px}
.opts.grid2{grid-template-columns:1fr 1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 0 var(--line);font-size:18px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;transition:transform .06s}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--surface));box-shadow:0 4px 0 var(--blue);color:var(--blue)}
.opt.tile{min-height:120px}
.opt.good{border-color:var(--green);background:var(--ok-bg);box-shadow:0 4px 0 var(--green);color:var(--ok-ink)}
.opt.wrong{border-color:var(--red);background:var(--bad-bg);box-shadow:0 4px 0 var(--red);animation:shake .3s}
.opt.done{opacity:.35;pointer-events:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .opt{min-height:74px}
.hero-pic{display:flex;align-items:center;justify-content:center;gap:14px}
.sentence{font-family:var(--display);font-size:28px;font-weight:600;text-align:center}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--blue);color:var(--blue);padding:0 6px}
.answer-line{min-height:62px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wchip{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:9px 14px;box-shadow:0 3px 0 var(--line);font-size:18px}
.wchip.used{visibility:hidden}
.write-in{font-family:var(--display);font-size:26px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;width:100%;box-sizing:border-box;letter-spacing:.04em}
.hint{text-align:center;color:var(--ink-2);font-size:15px}
.mic{width:110px;height:110px;border-radius:50%;background:var(--red);color:#fff;box-shadow:0 6px 0 var(--red-d);display:grid;place-items:center;margin:0 auto}
.mic svg{width:50px;height:50px}
.mic.on{animation:pulse 1s infinite}
.speak-status{text-align:center;font-size:16px;color:var(--ink-2);min-height:22px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{aspect-ratio:3/4;border-radius:14px;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:15px;font-weight:600;padding:4px;max-width:100%;text-align:center;overflow:hidden;word-break:break-word}
.mcard .back{font-size:26px;opacity:.9}
.mcard.up{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.mcard.ok{background:var(--ok-bg);border:2px solid var(--green);box-shadow:0 4px 0 var(--green);color:var(--ok-ink)}
.mcard .pic.emoji{font-size:34px}
.mcard .pic .sw{width:36px;height:36px}
.mcard .pic .num{font-size:36px}
.story{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.story h3{font-size:22px}
.story p{margin:0;font-size:18px;line-height:1.6;font-weight:600}
.story .es-t{color:var(--ink-2);font-size:15px}
.linkbtn{color:var(--blue);font-size:15px;text-decoration:underline;align-self:flex-start;padding:2px 0}
.tip{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:6px 16px}
.tip-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:2px solid var(--line)}
.tip-row:first-child{border-top:0}
.tip-row .en{font-family:var(--display);font-size:22px;font-weight:600}
.tip-row .es{color:var(--ink-2);font-size:15px}
.tip-row .t{flex:1}
.tip-row .abtn{padding:8px 10px}
#result .lwrap{box-sizing:border-box;justify-content:center;padding:24px 20px;gap:18px;text-align:center;overflow-y:auto}
#result h1{font-size:clamp(26px,8vw,34px);color:var(--yellow-d);overflow-wrap:anywhere}
#result .lwrap>*{min-width:0;max-width:100%}
.big-stars{display:flex;justify-content:center;gap:6px}
.big-stars svg{width:54px;height:54px}
.big-stars span:nth-child(2){transform:translateY(-12px)}
.new-medal{display:flex;align-items:center;gap:12px;text-align:left}
.new-medal .m{width:48px;height:48px;font-size:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--yellow) 30%,transparent);border:3px solid var(--yellow);flex:none}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,18,32,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div>*{flex-shrink:0}
.sheet>div{background:var(--surface);width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:60;font-size:15px;max-width:calc(100% - 48px);text-align:center}


/* groups & tasks */
.group-bar{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--purple) 10%,var(--surface));border:2px solid color-mix(in srgb,var(--purple) 30%,transparent);border-radius:14px;padding:8px 12px}
.group-bar .lbl{color:var(--purple);flex:none}
.group-bar select{flex:1;min-width:0;border:0;background:transparent;padding:6px 4px;font-weight:800;color:var(--ink)}
.cbrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px;cursor:pointer}
.cbrow input{width:20px;height:20px;accent-color:var(--purple);flex:none}
.field label.cbrow{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink)}
.cbrow small{margin-left:auto;color:var(--ink-2);font-weight:600;font-size:12px}
input[type=date].in{min-height:50px}
/* editor */
.ed-back{color:var(--purple);font-size:15px;display:inline-flex;align-items:center;gap:2px;margin-bottom:12px;padding:4px 0}
.ed-back svg{width:20px;height:20px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:2px solid var(--line);background:none;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main .t1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{display:block;color:var(--ink-2);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--uc,var(--purple)) 16%,transparent);color:var(--uc,var(--purple));flex:none}
.c-yellow .row .ico,.row.c-yellow .ico{color:#9A6B00}
.row .ico svg{width:21px;height:21px}
.tools{display:flex;gap:4px;flex:none}
.mini{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);border:2px solid var(--line);background:var(--surface);flex:none}
.mini svg{width:16px;height:16px}
.mini:disabled{opacity:.3;cursor:default}
.mini.danger{color:var(--red)}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-card{border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 0 var(--line)}
.type-card span{width:26px;height:26px;color:var(--purple)}
.type-card b{font-size:15px}
.type-card small{font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.3}
.wpick{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow-y:auto;padding:2px}
.wtag{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:4px 10px 4px 6px;background:var(--surface);font-size:15px}
.wtag .pic.emoji{font-size:22px}
.wtag .pic .sw{width:20px;height:20px}
.wtag .pic .num{font-size:20px}
.wtag .pic img.up{width:24px;height:24px;border-radius:6px}
.wtag[aria-pressed="true"]{border-color:var(--purple);background:color-mix(in srgb,var(--purple) 14%,var(--surface));color:var(--purple)}
.wprev{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none;overflow:hidden}
.wprev .pic.emoji{font-size:32px}
.wprev .pic .sw{width:30px;height:30px}
.wprev .pic .num{font-size:30px}
.wprev .pic img.up{width:52px;height:52px;border-radius:0}
.wprev .pic.mas .mascot{width:48px}
.wprev.big{width:120px;height:120px;border-radius:24px}
.wprev.big .pic.emoji{font-size:72px}
.wprev.big .pic .sw{width:70px;height:70px}
.wprev.big .pic img.up{width:120px;height:120px}
select.in{appearance:auto;min-width:0}
.swatches{display:flex;gap:10px}
.swatches button{width:38px;height:38px;border-radius:50%;background:var(--uc);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.pic img.up{width:70px;height:70px;object-fit:cover;border-radius:16px}
.pic.xl img.up{width:150px;height:150px;border-radius:24px}
.pic.sm img.up{width:48px;height:48px;border-radius:10px}
.mcard .pic img.up{width:44px;height:44px;border-radius:8px}
.tip-edit{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.tip-edit .in{font-size:15px;padding:10px}
.preview-banner{background:var(--purple);color:#fff;text-align:center;font-size:12px;padding:5px;letter-spacing:.08em}
.field input:disabled{opacity:.6}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>
/*PANDA_URIS*/
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){ if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return el;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const rnd = a => a[Math.floor(Math.random() * a.length)];
const norm = t => t.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
const opts = (ans, pool, n) => shuffle([ans, ...sample(pool.filter(x => x !== ans), n - 1)]);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); // fecha local (no UTC)
const dayKey = (back = 0) => { const d = new Date(); d.setDate(d.getDate() - back); return ymd(d); };
const today = () => dayKey(0);
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const endMark = t => /[.?!]$/.test(t) ? t : t + (/^(what|where|who|how|is|are|do|does|can|have|has)\b/i.test(t) ? '?' : '.');
const AV_COLORS = ['#1E6FD9','#2FA84F','#E8352E','#8E44C9','#FF8A1F','#0FA3A3','#D63384'];
function avatar(u, cls){ const i = [...u.id].reduce((a, c) => a + c.charCodeAt(0), 0) % AV_COLORS.length; return h('div', {class:'avatar ' + (cls || ''), style:'background:' + AV_COLORS[i], 'aria-hidden':'true'}, (u.name || '?').trim()[0].toUpperCase()); }

const ICON = {
  star: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>',

function toStep(it, poolFor){
  const ok = w => w && V[w];
  switch (it.t){
    case 'flash': case 'write': return ok(it.w) ? {t:it.t, w:it.w} : null;
    case 'pickword': return ok(it.w) ? {t:'pickword', w:it.w, options:opts(it.w, poolFor(it.w), 3)} : null;
    case 'listen': return ok(it.w) ? {t:'listen', w:it.w, options:opts(it.w, poolFor(it.w), 4)} : null;
    case 'match': case 'memory': { const ws = uniq((it.words || []).filter(ok)).slice(0, 6); return ws.length >= 2 ? {t:it.t, words:ws} : null; }
    case 'speak': return it.text ? {t:'speak', text:it.text, img:it.img || '🗣️'} : null;
    case 'order': return it.sentence && it.sentence.trim().split(/\s+/).length >= 2 ? {t:'order', sentence:it.sentence.trim(), extra:it.extra || [], img:it.img || '✏️'} : null;
    case 'fill': return it.answer ? {t:'fill', before:it.before || '', answer:it.answer, after:it.after || '', options:shuffle(uniq([it.answer, ...(it.options || [])])), img:it.img || '✏️'} : null;
    case 'tip': return (it.lines || []).length ? {t:'tip', title:it.title || 'Mini clase', lines:it.lines} : null;
    case 'read': return it.story && it.story.en && it.q && it.answer ? {t:'read', story:it.story, q:it.q, answer:it.answer, options:shuffle(uniq([it.answer, ...(it.options || [])]))} : null;
  }
  return null;
}
function buildSteps(lesson, unit){
  const lw = uniq(lesson.items.flatMap(wordsOf)).filter(w => V[w]);
  const uw = uniq((unit ? unit.lessons : []).flatMap(l => l.items.flatMap(wordsOf))).filter(w => V[w]);
  const poolFor = w => { let p = lw.filter(x => x !== w); if (p.length < 3) p = uniq(p.concat(uw.filter(x => x !== w))); if (p.length < 3) p = uniq(p.concat(Object.keys(V).filter(x => x !== w))); return p; };
  const steps = lesson.items.map(it => toStep(it, poolFor)).filter(Boolean);
  return lesson.shuffle ? shuffle(steps) : steps;
}

function diffRows(prev, cur, table, toRow, ops){

  prev.forEach(x => { if (!cur.some(y => y.id === x.id)) ops.push(SB.from(table).delete().eq('school_id', SCHOOL).eq('id', x.id)); });
}
async function doSync(){

  if (isAdmin){
    if (JSON.stringify(cur.course) !== JSON.stringify(prev.course)) ops.push(SB.from('courses').upsert({school_id:SCHOOL, data:cur.course, version:2, updated_at:now}));
    diffRows(prev.groups.filter(g => g.id !== 'g0'), cur.groups.filter(g => g.id !== 'g0'), 'groups', (g, i) => ({school_id:SCHOOL, id:g.id, name:g.name, open:g.open, sort:i}), ops);
    diffRows(prev.assignments, cur.assignments, 'assignments', a => ({school_id:SCHOOL, id:a.id, title:a.title, due:a.due, lessons:a.lessons, writing:a.writing, groups:a.groups}), ops);
    cur.users.forEach(u => { const o = prev.users.find(x => x.id === u.id); if (o && u.role === 'student' && (o.groupId !== u.groupId || o.name !== u.name)) ops.push(SB.from('profiles').update({group_id:u.groupId, name:u.name}).eq('id', u.id)); });
  } else {
    const strip = p => { const c = {...(p || {})}; delete c.hw; return c; };
    if (JSON.stringify(strip(cur.progress[cur.session])) !== JSON.stringify(strip(prev.progress[cur.session]))) ops.push(SB.from('progress').upsert({user_id:cur.session, school_id:SCHOOL, data:strip(cur.progress[cur.session]), updated_at:now}));
  }

    const a = (cur.progress[uid] || {}).hw || {}, b = ((prev.progress[uid] || {}).hw) || {};

    const v = V[s.w];
    ctx.body.append(h('div', {class:'flash pop'}, pic(v.img, 'xl'), h('div', {class:'word'}, s.w), h('div', {class:'es'}, v.es), h('div', {class:'audio-row'}, audioBtn(s.w), audioBtn(s.w, true))));
    say(s.w); ctx.cont();
  },
  tip(s, ctx){
    ctx.body.append(h('h3', {style:'font-size:22px;color:var(--uc)'}, s.title),
      h('div', {class:'tip'}, ...s.lines.map(([en, es]) => h('div', {class:'tip-row'}, h('div', {class:'t'}, h('div', {class:'en'}, en), h('div', {class:'es'}, es)), audioBtn(en)))));
    ctx.cont();
  },
  pickword(s, ctx){
    ctx.body.append(h('div', {class:'flash'}, pic(V[s.w].img, 'xl'), h('div', {class:'es'}, '“' + V[s.w].es + '”')));
    const box = h('div', {class:'opts'}); let sel = null;
    s.options.forEach(o => { const b = h('button', {class:'opt', type:'button'}, o); selectable(box, () => { sel = o; say(o); ctx.ready(() => ({ok: sel === s.w, correct: s.w})); })(b); box.append(b); });
    ctx.body.append(box);
  },
  listen(s, ctx){
    ctx.body.append(h('div', {class:'audio-row'}, audioBtn(s.w, false, true), audioBtn(s.w, true)));
    const box = h('div', {class:'opts grid2'}); let sel = null;
    s.options.forEach(o => { const b = h('button', {class:'opt tile', type:'button', 'aria-label':'Opción'}, pic(V[o].img)); selectable(box, () => { sel = o; ctx.ready(() => ({ok: sel === s.w, correct: s.w + ' (' + V[s.w].es + ')'})); })(b); box.append(b); });
    ctx.body.append(box);
    setTimeout(() => say(s.w), 250);
  },
  match(s, ctx){
    ctx.hideBtn();
    const left = h('div', {class:'col'}), right = h('div', {class:'col'});
    let a = null, b = null, matched = 0;
    const tryPair = () => {
      if (!a || !b) return;
      const A = a, B = b; a = b = null;
      if (A.dataset.w === B.dataset.w){
        [A, B].forEach(x => { x.classList.remove('sel'); x.classList.add('good'); setTimeout(() => x.classList.add('done'), 350); });
        say(A.dataset.w); matched++;
        if (matched === s.words.length) setTimeout(() => ctx.finish(true), 500);
      } else { [A, B].forEach(x => { x.classList.remove('sel'); x.classList.add('wrong'); setTimeout(() => x.classList.remove('wrong'), 400); }); sfx(false); }
    };
    shuffle(s.words).forEach(w => { const el = h('button', {class:'opt', type:'button', 'data-w':w}, w); el.onclick = () => { $$('.opt', left).forEach(o => o.classList.remove('sel')); el.classList.add('sel'); a = el; say(w); tryPair(); }; left.append(el); });
    shuffle(s.words).forEach(w => { const el = h('button', {class:'opt', type:'button', 'data-w':w, 'aria-label':'Imagen'}, pic(V[w].img, 'sm')); el.onclick = () => { $$('.opt', right).forEach(o => o.classList.remove('sel')); el.classList.add('sel'); b = el; tryPair(); }; right.append(el); });
    ctx.body.append(h('div', {class:'match'}, left, right));
  },
  write(s, ctx){
    const v = V[s.w];
    ctx.body.append(h('div', {class:'flash'}, pic(v.img, 'xl'), h('div', {class:'es'}, '“' + v.es + '”'), h('div', {class:'audio-row'}, audioBtn(s.w), audioBtn(s.w, true))));
    const inp = h('input', {class:'write-in', id:'writeIn', autocomplete:'off', autocapitalize:'off', spellcheck:'false', 'aria-label':'Escribe la palabra en inglés', placeholder: s.w.split('').map((c, i) => i === 0 ? c : (c === ' ' ? ' ' : '_')).join(' ')});
    inp.addEventListener('input', () => inp.value.trim() ? ctx.ready(() => ({ok: norm(inp.value) === norm(s.w), correct: s.w})) : ctx.unready());
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) $('#lbtn').click(); });
    ctx.body.append(inp, h('div', {class:'hint'}, `Pista: empieza con “${s.w[0]}” y tiene ${s.w.replace(/ /g, '').length} letras`));
    setTimeout(() => inp.focus(), 50);
  },
  speak(s, ctx){
    ctx.hideBtn();
    ctx.body.append(h('div', {class:'flash'}, pic(s.img, 'xl'), h('div', {class:'sentence'}, s.text), h('div', {class:'audio-row'}, audioBtn(s.text), audioBtn(s.text, true))));
    const status = h('div', {class:'speak-status', 'aria-live':'polite'}, 'Toca el micrófono y di la frase');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let tries = 0;
    const done = () => { if (S && !L.preview){ S.spoken++; save(); } ctx.finish(true); };
    const fallback = msg => { status.textContent = msg; if (!$('#saidIt')) ctx.body.append(h('button', {class:'btn blue', id:'saidIt', type:'button', onclick:done}, 'Ya lo dije en voz alta')); };
    const mic = h('button', {class:'mic', type:'button', 'aria-label':'Hablar', html:ICON.mic, onclick:() => {
      if (!SR) return fallback('Repite la frase en voz alta y luego toca el botón.');
      try {
        const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 5;
        mic.classList.add('on'); status.textContent = 'Te escucho…';
        let heard = false;
        const stopT = setTimeout(() => { try { rec.stop(); } catch (x) {} }, 9000);
        const watch = setTimeout(() => { if (heard) return; try { rec.abort(); } catch (x) {} mic.classList.remove('on'); tries++; fallback('No te escuché. Si ya lo dijiste en voz alta, toca el botón.'); }, 11000);
        rec.addEventListener('result', () => { heard = true; clearTimeout(watch); });
        rec.addEventListener('error', () => { heard = true; clearTimeout(watch); });
        rec.addEventListener('end', () => clearTimeout(stopT));
        rec.onresult = e => {
          const best = speechScore(s.text, [...e.results[0]].map(a => a.transcript));
          if (best >= 0.6){ status.textContent = 'Escuché: “' + e.results[0][0].transcript + '”'; done(); }
          else { tries++; status.textContent = 'Escuché: “' + e.results[0][0].transcript + '”. ¡Intenta otra vez!'; sfx(false); if (tries >= 2) fallback('Escuché algo diferente. Si ya lo dijiste bien, toca el botón.'); }
        };
        rec.onerror = ev => {
          const er = ev && ev.error;
          if (er === 'aborted') return;
          if (er === 'no-speech'){ tries++; status.textContent = micErrorMsg(er); sfx(false); if (tries >= 2) fallback(micErrorMsg(er) + ' Si ya lo dijiste, toca el botón.'); }
          else fallback(micErrorMsg(er) + ' Repite la frase en voz alta y toca el botón.');
        };
        rec.onend = () => mic.classList.remove('on');
        rec.start();
      } catch (e) { mic.classList.remove('on'); fallback('No pude usar el micrófono aquí. Repite la frase en voz alta y toca el botón.'); }
    }});
    ctx.body.append(mic, status);
    setTimeout(() => say(s.text), 250);
  },
  order(s, ctx){
    const words = s.sentence.split(' ');
    ctx.body.append(h('div', {class:'hero-pic'}, pic(s.img), audioBtn(endMark(s.sentence))));
    const line = h('div', {class:'answer-line', 'aria-label':'Tu oración'}), bank = h('div', {class:'bank'});
    const picked = [];
    const update = () => { picked.length ? ctx.ready(() => ({ok: norm(picked.map(p => p.w).join(' ')) === norm(s.sentence), correct: endMark(s.sentence)})) : ctx.unready(); };
    shuffle([...words, ...s.extra]).forEach(w => {
      const chip = h('button', {class:'wchip', type:'button'}, w);
      chip.onclick = () => {
        if (chip.classList.contains('used')) return;
        chip.classList.add('used'); say(w);
        const item = {w, chip}; const placed = h('button', {class:'wchip pop', type:'button'}, w);
        placed.onclick = () => { placed.remove(); chip.classList.remove('used'); picked.splice(picked.indexOf(item), 1); update(); };
        picked.push(item); line.append(placed); update();
      };
      bank.append(chip);
    });
    ctx.body.append(line, bank);
  },
  fill(s, ctx){
    const blank = h('span', {class:'blank'}, ' ');
    ctx.body.append(h('div', {class:'flash'}, pic(s.img, 'xl'), h('div', {class:'sentence'}, s.before + ' ', blank, s.after)));
    const box = h('div', {class:'opts grid2'}); let sel = null;
    s.options.forEach(o => { const b = h('button', {class:'opt', type:'button'}, o); selectable(box, () => { sel = o; blank.textContent = o; say(`${s.before} ${o}${s.after}`); ctx.ready(() => ({ok: sel === s.answer, correct: `${s.before} ${s.answer}${s.after}`})); })(b); box.append(b); });
    ctx.body.append(box);
  },
  memory(s, ctx){
    ctx.hideBtn();
    const cards = shuffle(s.words.flatMap(w => [{w, kind:'word'}, {w, kind:'pic'}]));
    let open = [], found = 0, busy = false;
    const grid = h('div', {class:'mem'});
    cards.forEach(c => {
      const el = h('button', {class:'mcard', type:'button', 'aria-label':'Carta'}, h('span', {class:'back'}, '?'));
      const face = () => { el.innerHTML = ''; el.append(c.kind === 'word' ? c.w : pic(V[c.w].img)); el.classList.add('up'); };
      const hide = () => { el.innerHTML = ''; el.append(h('span', {class:'back'}, '?')); el.classList.remove('up'); };
      el.onclick = () => {
        if (busy || el.classList.contains('up') || el.classList.contains('ok')) return;
        face(); if (c.kind === 'word') say(c.w);
        open.push({c, el, hide});
        if (open.length === 2){
          const [x, y] = open; open = [];
          if (x.c.w === y.c.w && x.c.kind !== y.c.kind){
            [x.el, y.el].forEach(e => { e.classList.remove('up'); e.classList.add('ok'); }); found++; sfx(true);
            if (found === s.words.length) setTimeout(() => ctx.finish(true), 500);
          } else { busy = true; setTimeout(() => { x.hide(); y.hide(); busy = false; }, 900); }
        }
      };
      grid.append(el);
    });
    ctx.body.append(h('p', {class:'muted', style:'margin:-8px 0 0'}, 'Cada palabra tiene su imagen. Voltea dos cartas a la vez.'), grid);
  },
  read(s, ctx){
    const st = s.story;
    const es = h('p', {class:'es-t', hidden:true}, st.es || '');
    const tog = h('button', {class:'linkbtn', type:'button', onclick:() => { es.hidden = !es.hidden; tog.textContent = es.hidden ? 'Ver en español' : 'Ocultar español'; }}, 'Ver en español');
    ctx.body.append(h('div', {class:'story'}, h('div', {style:'display:flex;align-items:center;justify-content:space-between;gap:8px'}, h('h3', {}, st.title || 'Lectura'), audioBtn(st.en)), h('p', {}, st.en), st.es ? tog : null, es),
      h('h3', {style:'font-size:20px'}, s.q));
    const box = h('div', {class:'opts'}); let sel = null;
    s.options.forEach(o => { const b = h('button', {class:'opt', type:'button'}, o); selectable(box, () => { sel = o; ctx.ready(() => ({ok: sel === s.answer, correct: s.answer})); })(b); box.append(b); });
    ctx.body.append(box);
  }
};

if (REMOTE) remoteBoot(); else route();
</script>
