<title>Pandi English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-width column; login first, then student app (map path) or admin panel; lesson player on top */
:root{
  --bg:#F1F6FD; --surface:#FFFFFF; --surface-2:#E6EEF9; --ink:#14233B; --ink-2:#5A6B85; --line:#D5E0EF;
  --red:#E8352E; --red-d:#B92620; --yellow:#FFC531; --yellow-d:#C98F00; --blue:#1E6FD9; --blue-d:#1453A8;
  --green:#2FA84F; --green-d:#1F7F39; --purple:#8E44C9; --purple-d:#6A2C9E; --orange:#FF8A1F;
  --locked:#C9D3E1; --locked-d:#A9B5C6; --ok-bg:#DDF5E3; --bad-bg:#FDE3E1; --ok-ink:#1F7F39; --bad-ink:#B92620;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --surface:#17223A; --surface-2:#1F2D4A; --ink:#EAF1FF; --ink-2:#9FB0CC; --line:#2A3A5A;
  --locked:#334360; --locked-d:#24314A; --ok-bg:#143823; --bad-bg:#3D1A1A; --ok-ink:#6EE08F; --bad-ink:#FF8A80; --yellow-d:#FFC531; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#17223A; --surface-2:#1F2D4A; --ink:#EAF1FF; --ink-2:#9FB0CC; --line:#2A3A5A;
  --locked:#334360; --locked-d:#24314A; --ok-bg:#143823; --bad-bg:#3D1A1A; --ok-ink:#6EE08F; --bad-ink:#FF8A80; --yellow-d:#FFC531; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;font-weight:700;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
[hidden]{display:none!important}
.screen[hidden]{display:none!important}
.mascot{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

.c-blue{--uc:var(--blue);--ucd:var(--blue-d);--uink:#fff}
.c-green{--uc:var(--green);--ucd:var(--green-d);--uink:#fff}
.c-red{--uc:var(--red);--ucd:var(--red-d);--uink:#fff}
.c-yellow{--uc:var(--yellow);--ucd:#C98F00;--uink:#14233B}
.c-purple{--uc:var(--purple);--ucd:var(--purple-d);--uink:#fff}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:16px;
  font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.02em;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn:disabled{background:var(--locked);box-shadow:0 4px 0 var(--locked-d);color:var(--ink-2);cursor:default}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.ghost{background:var(--surface);color:var(--blue);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.small{font-size:16px;padding:10px 14px;border-radius:13px}
.btn.blue:disabled,.btn.ghost:disabled{background:var(--locked);box-shadow:0 4px 0 var(--locked-d);color:var(--ink-2);border-color:transparent}
.node-wrap.has-tag{margin-top:34px}

/* login */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:28px 20px}
.brand{font-family:var(--display);font-size:32px;font-weight:700;text-align:center;letter-spacing:.01em}
.brand span{color:var(--green)} .brand i{font-style:normal;color:var(--blue)}
.hero-panda{width:150px;margin:0 auto;animation:bob 2.6s ease-in-out infinite}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 18px;font-size:17px;text-align:center}
.bubble b{font-family:var(--display);font-size:23px;font-weight:600;display:block;color:var(--green)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.in,textarea{font:inherit;font-size:18px;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.err{color:var(--bad-ink);background:var(--bad-bg);border-radius:12px;padding:10px 12px;font-size:15px;margin:0}
.demo{border:2px dashed var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.demo-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.demo-row .r{flex:1;min-width:0}
.demo-row small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.demo-row .tag{font-size:12px;letter-spacing:.06em;padding:4px 8px;border-radius:9px;color:#fff;background:var(--green)}
.demo-row .tag.adm{background:var(--purple)}

/* top bar + tabs */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg);border-bottom:2px solid var(--line)}
.topbar .logo{width:42px;flex:none}
.topbar .name{font-family:var(--display);font-size:20px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#home .topbar{gap:8px;padding:8px 12px}
#home .topbar .chip{font-size:16px;gap:2px}
#home .topbar .chip svg{width:19px;height:19px}
@media (max-width:400px){#home .topbar .name{font-size:17px}#home .topbar .logo{width:36px}}
.topbar .name span{color:var(--green)}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.chip svg{width:22px;height:22px}
.chip.fire{color:var(--orange)} .chip.xp{color:var(--yellow-d)}
.topbar .name .role-pill{color:#fff}
.role-pill{font-size:11px;letter-spacing:.1em;background:var(--purple);color:#fff;padding:4px 8px;border-radius:9px;vertical-align:middle;margin-left:6px;font-family:var(--body)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);border:2px solid var(--line);background:var(--surface)}
.iconbtn svg{width:20px;height:20px}
.tab{padding:16px 16px 110px}
.tab[hidden]{display:none}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6;box-sizing:border-box}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12px;color:var(--ink-2)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.nav.adm button[aria-current="page"]{color:var(--purple);background:color-mix(in srgb,var(--purple) 12%,transparent)}

/* map */
.unit-banner{background:var(--uc);color:var(--uink);border-radius:20px;padding:16px 18px;box-shadow:0 4px 0 var(--ucd);display:flex;align-items:center;gap:12px;margin-top:8px}
.unit-banner .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.unit-banner h2{font-size:26px}
.unit-banner p{margin:2px 0 0;font-size:14px;opacity:.92}
.unit-banner .count{margin-left:auto;font-family:var(--display);font-size:18px;background:rgba(255,255,255,.22);padding:6px 10px;border-radius:12px;white-space:nowrap}
.unit-banner.locked{background:var(--surface-2);color:var(--ink-2);box-shadow:0 4px 0 var(--line)}
.unit-banner.locked .count{background:var(--surface)}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:52px 0 30px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.node{width:74px;height:74px;border-radius:50%;background:var(--uc);box-shadow:0 6px 0 var(--ucd);display:grid;place-items:center;color:var(--uink);transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ucd)}
.node svg{width:34px;height:34px}
.node.locked{background:var(--locked);box-shadow:0 6px 0 var(--locked-d);color:var(--ink-2)}
.node.current{outline:6px solid color-mix(in srgb,var(--uc) 30%,transparent);outline-offset:4px;animation:pulse 1.6s ease-in-out infinite}
.node-label{font-size:13px;color:var(--ink-2);text-align:center;line-height:1.2;max-width:130px}
.node-label b{display:block;color:var(--ink);font-size:14px}
.stars{display:flex;gap:1px;justify-content:center}
.stars svg{width:15px;height:15px}
.start-tag{position:absolute;top:-38px;background:var(--surface);border:2px solid var(--line);color:var(--uc);font-family:var(--display);font-weight:600;padding:5px 12px;border-radius:12px;white-space:nowrap;animation:bob 2s ease-in-out infinite;font-size:15px}
.start-tag::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.panda-say{display:flex;gap:10px;align-items:flex-end}
.panda-say .mascot{width:76px;flex:none}
.panda-say .bubble{text-align:left;font-size:16px;flex:1;min-width:0}

.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.section-title{font-size:24px;margin:4px 0 12px}
.muted{color:var(--ink-2);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--line)}
.task:first-of-type{border-top:0}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.check svg{width:18px;height:18px}
.due{display:inline-block;background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);padding:3px 10px;border-radius:10px;font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;background:var(--surface-2);color:var(--ink-2);letter-spacing:.04em}
.pill.warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.pill.okp{background:var(--ok-bg);color:var(--ok-ink)}
.note{background:color-mix(in srgb,var(--green) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:14px;padding:12px}

.profile{display:flex;gap:14px;align-items:center}
.profile .av{width:76px;height:76px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;overflow:hidden}
.profile .av .mascot{width:70px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat span{overflow-wrap:anywhere}
.stats.four{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.medal{text-align:center;padding:12px 6px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.medal .m{width:58px;height:58px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--yellow) 30%,transparent);border:3px solid var(--yellow)}
.medal.off .m{filter:grayscale(1);opacity:.35;border-color:var(--line);background:var(--surface-2)}
.medal b{font-size:13px;display:block;line-height:1.2}
.medal small{font-size:11px;color:var(--ink-2);font-weight:600;display:block;margin-top:3px;line-height:1.25}

/* ranking */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{padding:9px;border-radius:11px;color:var(--ink-2);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:8px;margin:8px 0 18px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .avatar{width:56px;height:56px;font-size:22px}
.pod .name{font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod .block{width:100%;border-radius:14px 14px 6px 6px;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:700;color:#fff}
.pod.p1 .block{height:96px;background:var(--yellow);color:#14233B;box-shadow:0 4px 0 #C98F00}
.pod.p2 .block{height:72px;background:#9DB0C8;box-shadow:0 4px 0 #7D8FA6}
.pod.p3 .block{height:56px;background:#D9874A;box-shadow:0 4px 0 #AF6630}
.pod .pts{font-size:13px;color:var(--ink-2)}
.avatar{border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;color:#fff;flex:none;position:relative}
.avatar.svg-av{background:none;overflow:hidden}
.avatar svg,.avmini svg,.av-preview svg{width:100%;height:100%;display:block}
.av-preview{width:150px;height:150px;margin:0 auto}
.av-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.av-tabs button{flex:none;font:inherit;font-size:15px;font-weight:700;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.av-tabs button[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.av-grid .avmini{display:block;width:62px;height:62px;margin:0 auto 4px}
.av-sw button{width:44px;height:44px}
.shop-item .avmini.big{display:block;width:84px;height:84px;margin:0 auto}
.avatar .emo{font-size:1.45em;line-height:1}
.avatar .acc{position:absolute;top:-.45em;right:-.45em;font-size:.95em;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.avatar.xl{width:120px;height:120px;font-size:44px}
.av-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.av-grid button{font-size:30px;padding:8px 2px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.av-grid button[aria-pressed=true]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--surface))}
.av-grid button:disabled{opacity:.45}
.av-grid small{display:block;font-size:12px;color:var(--ink-2);font-weight:700}
.friend-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--line)}
.friend-row:first-of-type{border-top:0}
.friend-row .nm{flex:1;min-width:0;font-weight:800}
.friend-row .nm small{display:block;color:var(--ink-2);font-weight:600;font-size:14px}
.friend-row .avatar{width:44px;height:44px;font-size:18px}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px}
.rank-row+.rank-row{margin-top:4px}
.rank-row .pos{width:24px;text-align:center;font-family:var(--display);font-size:18px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rank-row .avatar{width:40px;height:40px;font-size:17px}
.rank-row .nm{flex:1;min-width:0}
.rank-row .nm small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.rank-row .xpv{font-family:var(--display);font-size:18px;color:var(--yellow-d);font-variant-numeric:tabular-nums}
.rank-row.me{background:color-mix(in srgb,var(--blue) 12%,transparent);border:2px solid color-mix(in srgb,var(--blue) 35%,transparent)}

/* admin */
.switch-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--line)}
.switch-row:first-of-type{border-top:0}
.switch-row .dot{width:14px;height:14px;border-radius:50%;background:var(--uc);flex:none}
.switch-row .t{flex:1;min-width:0}
.switch-row .t small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:20px;background:var(--locked);transition:.15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+span{background:var(--green)}
.switch input:disabled{cursor:default}
.switch input:disabled+span{opacity:.45}
.switch input:checked+span::after{left:25px}
.switch input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.stu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:2px solid var(--line)}
.stu:first-of-type{border-top:0}
.stu .avatar{width:44px;height:44px;font-size:18px}
.stu .nm{flex:1;min-width:0}
.stu .nm small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.stu .chev{color:var(--ink-2);width:20px}
.bar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.unit-prog{display:flex;align-items:center;gap:10px;padding:8px 0}
.unit-prog .nm{width:110px;font-size:14px}
.unit-prog .bar{flex:1;margin:0}
.unit-prog .v{font-size:13px;color:var(--ink-2);width:40px;text-align:right;font-variant-numeric:tabular-nums}
.hw{border-top:2px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:10px}
.hw:first-of-type{border-top:0;padding-top:4px}
.hw .head{display:flex;align-items:center;gap:10px}
.hw .head .nm{flex:1;min-width:0}
.hw .head small{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.hw .head .avatar{width:40px;height:40px;font-size:17px}
.profile .avatar{width:64px;height:64px;font-size:26px}
.pill{white-space:nowrap}
.grade-badge{background:var(--ok-ink);color:var(--surface);border-radius:12px;padding:4px 10px;font-size:17px;font-family:var(--display)}
.hw blockquote{margin:0;background:var(--surface-2);border-radius:12px;padding:12px;font-size:16px;line-height:1.5}
.form-grid{display:grid;gap:10px}

/* lesson */
#lesson,#result{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lwrap{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.ltop{display:flex;align-items:center;gap:12px;padding:12px 16px}
.ltop .x{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}
.ltop .x svg{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:10px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--green);border-radius:10px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.lbody{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:18px}
.lbody.locked{pointer-events:none}
.prompt{font-size:24px}
.lfoot{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:10px}
.lfoot.ok{background:var(--ok-bg);border-color:transparent}
.lfoot.bad{background:var(--bad-bg);border-color:transparent}
.lfoot.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.fb{display:flex;flex-direction:column;gap:2px;font-size:15px}
.fb:empty{display:none}
.fb strong{font-family:var(--display);font-size:22px;font-weight:600}
.lfoot.ok .fb{color:var(--ok-ink)} .lfoot.bad .fb{color:var(--bad-ink)}
.pic{display:grid;place-items:center;line-height:1}
.pic.emoji{font-size:64px}
.pic.xl.emoji{font-size:110px}
.pic.sm.emoji{font-size:46px}

  const ST1 = {title:'The Kite in the Tree', en:"Charlie, Rose and Ola are at the toy store. \"Look at these toys!\" says Rose. Charlie likes the red truck. Rose likes the doll. Oh no! A girl is sad. Her kite is in a tree. \"Can we help?\" asks Charlie. Pandi climbs the tree. \"Look! It's a kite!\" The girl is happy. \"Thank you!\" \"Hooray!\"", es:'Charlie, Rose y Ola están en la juguetería. “¡Miren estos juguetes!”, dice Rose. A Charlie le gusta el camión rojo. A Rose le gusta la muñeca. ¡Oh, no! Una niña está triste. Su papalote está en un árbol. “¿Podemos ayudar?”, pregunta Charlie. Pandi sube al árbol. “¡Mira! ¡Es un papalote!” La niña está feliz. “¡Gracias!” “¡Hurra!”'};
  const ST2 = {title:"Grandpa's Birthday", en:"It's Grandpa's birthday! Charlie, Rose and Ola help Uncle Dan. \"Where's Aunt Lily?\" asks Charlie. She's in the post office. \"Where are my cousins?\" They're in the yard. Uncle Dan is in the bakery. He has a big cake! Now the family is in the house. \"Surprise!\" \"Thank you!\" says Grandpa. \"Hooray!\"", es:'¡Es el cumpleaños del abuelo! Charlie, Rose y Ola ayudan al tío Dan. “¿Dónde está la tía Lily?”, pregunta Charlie. Está en el correo. “¿Dónde están mis primos?” Están en el patio. El tío Dan está en la panadería. ¡Tiene un pastel grande! Ahora la familia está en la casa. “¡Sorpresa!” “¡Gracias!”, dice el abuelo. “¡Hurra!”'};

  const ST8 = {title:'A Day at the Beach', en:"On Saturday, the friends go to the beach. \"What's the weather like?\" asks Rose. \"It's sunny!\" says Charlie. They play in the water. Then it's cloudy and windy. \"Let's fly a kite!\" says Uncle Dan. Oh no! Now it's rainy. They run to the beach house and read a book. Then the sun comes back. \"Hooray!\"", es:'El sábado los amigos van a la playa. “¿Cómo está el tiempo?”, pregunta Rose. “¡Está soleado!”, dice Charlie. Juegan en el agua. Luego está nublado y con viento. “¡Volemos un papalote!”, dice el tío Dan. ¡Oh, no! Ahora llueve. Corren a la casa de la playa y leen un libro. Luego vuelve a salir el sol. “¡Hurra!”'};

function upgradeCourse(c){
  if ((c.ver || 2) >= COURSE_VER) return false;
  const seedC = courseSeed();
  for (const [k, v] of Object.entries(seedC.vocab)) if (!c.vocab[k]) c.vocab[k] = v;
  for (const su of seedC.units) if ((su.level || 1) >= 2 && !c.units.some(u => u.id === su.id)) c.units.push(su);
  c.ver = COURSE_VER;
  return true;
}

function autoItems(words){

  sample(words, Math.min(2, words.length)).forEach(w => items.push({t:'pickword', w}));

  items.push({t:'write', w:rnd(words)});
  if (words.length >= 3) items.push({t:'memory', words:words.slice(0, 4)});
  return items;

function shrinkImage(file, cb){

    const S2 = 240, c = document.createElement('canvas'); c.width = c.height = S2;
    const k = Math.max(S2 / im.width, S2 / im.height), w = im.width * k, hh = im.height * k;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, S2, S2); g.drawImage(im, (S2 - w) / 2, (S2 - hh) / 2, w, hh);
    cb(c.toDataURL('image/jpeg', 0.8));
  }; im.onerror = () => toast('No pude leer esa imagen. Prueba con otra.'); im.src = fr.result; };
  fr.readAsDataURL(file);

function diffRows(prev, cur, table, toRow, ops){

  cur.forEach((x, i) => { const row = toRow(x, i); if (pm.get(x.id) !== JSON.stringify(x) || (table === 'groups' && prev.findIndex(y => y.id === x.id) !== i)) ops.push(SB.from(table).upsert(row)); });
  prev.forEach(x => { if (!cur.some(y => y.id === x.id)) ops.push(SB.from(table).delete().eq('school_id', SCHOOL).eq('id', x.id)); });
}
async function doSync(){
  if (!DB.session) return;
  const cur = clone(DB), prev = SNAP, ops = [], now = new Date().toISOString();
  const isAdmin = (cur.users.find(u => u.id === cur.session) || {}).role === 'admin';
  if (isAdmin){

    diffRows(prev.assignments, cur.assignments, 'assignments', a => ({school_id:SCHOOL, id:a.id, title:a.title, due:a.due, lessons:a.lessons, writing:a.writing, groups:a.groups}), ops);
    cur.users.forEach(u => { const o = prev.users.find(x => x.id === u.id); if (o && u.role === 'student' && (o.groupId !== u.groupId || o.name !== u.name)) ops.push(SB.from('profiles').update({group_id:u.groupId, name:u.name}).eq('id', u.id)); });
  } else {
    const strip = p => { const c = {...(p || {})}; delete c.hw; return c; };
    if (JSON.stringify(strip(cur.progress[cur.session])) !== JSON.stringify(strip(prev.progress[cur.session]))) ops.push(SB.from('progress').upsert({user_id:cur.session, school_id:SCHOOL, data:strip(cur.progress[cur.session]), updated_at:now}));
  }
  (isAdmin ? Object.keys(cur.progress) : [cur.session]).forEach(uid => {
    const a = (cur.progress[uid] || {}).hw || {}, b = ((prev.progress[uid] || {}).hw) || {};

      ? SB.from('submissions').update({note:x.note || '', reviewed:!!x.reviewed, grade:x.grade ?? null, history:x.history || []}).eq('assignment_id', aid).eq('user_id', uid)
      : SB.from('submissions').upsert({school_id:SCHOOL, assignment_id:aid, user_id:uid, text:x.text || '', sent_at:x.sentAt || null, note:x.note || '', reviewed:!!x.reviewed})); });
  });
  if (!ops.length){ SNAP = cur; return; }

}

function dragify(el, onDrop){
  el.addEventListener('pointerdown', e => {
    const sx = e.clientX, sy = e.clientY; let ghost = null;
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
      if (!ghost){ ghost = el.cloneNode(true); ghost.classList.add('ghost'); document.body.append(ghost); }
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; ev.preventDefault();
    };
    const up = ev => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      if (!ghost) return;
      ghost.remove(); el.dataset.dragged = '1'; setTimeout(() => delete el.dataset.dragged, 60);
      onDrop(document.elementFromPoint(ev.clientX, ev.clientY));
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  });
}

      const c = h('button', {class:'wchip', type:'button', 'data-w':w}, w);

function picSVG(img, cx, cy, size){
  if (isFriend(img)) return placeSVG(friendSVG(img), cx - size / 2, cy - size / 2, size);
  const w = V[img]; img = w ? w.img : img;
  if (!img) return '';
  if (img.startsWith('w:')) return picSVG(img.slice(2), cx, cy, size);
  if (img.startsWith('sw:') && /^#[0-9a-f]{3,8}$/i.test(img.slice(3))) return `<circle cx="${cx}" cy="${cy}" r="${size * 0.36}" fill="${img.slice(3)}" ${SW}/>`;
  if (img.startsWith('n:')) return `<text x="${cx}" y="${cy}" font-size="${size * 0.5}" font-weight="800" font-family="Arial, sans-serif" fill="#1E6FD9" text-anchor="middle" dominant-baseline="central">${escSVG(img.slice(2))}</text>`;
  if (img.startsWith('data:image/svg+xml,')) return `<image href="${escSVG(img)}" x="${cx - size * 0.4}" y="${cy - size * 0.4}" width="${size * 0.8}" height="${size * 0.8}"/>`;
  if (img.startsWith('data:')) return '';
  return `<text x="${cx}" y="${cy + size * 0.04}" font-size="${size * 0.58}" text-anchor="middle" dominant-baseline="central">${escSVG(img)}</text>`;
}

function gridArt(bg, items, slots){

// Rotan por lección para que no se repitan y siempre hay al menos uno de gramática.
const FIX_RULES = [

  ['does', 'do', 'En preguntas con he, she o it se usa «Does»; con I, you, we y they, «Do».'],
  ["doesn't", "don't", "Con he, she e it se dice «doesn't»; con I, you, we y they, «don't»."],
  ['is', 'are', 'Para una sola cosa se usa «is»; para varias, «are».'],
  ["isn't", "aren't", "Para una sola cosa se usa «isn't»; para varias, «aren't»."],
  ['was', 'were', 'Con I, he, she e it se usa «was»; con you, we y they, «were».'],
  ['this', 'these', 'Para una cosa se dice «this»; para varias cosas, «these».'],
  ['likes', 'like', 'Con he, she e it el verbo lleva -s: «likes». Con I, you, we y they, «like».'],

const SWAP = {};

// Oraciones de la lección: mini clases, completar, hablar, ordenar y globos de los cantos y cuentos
function lessonSentences(lesson){

    if (it.t === 'tip' || (it.t === 'scene' && it.mode === 'chant')) (it.lines || []).forEach(([en]) => out.push(en));
    if (it.t === 'scene' && it.mode === 'story') (it.panels || []).forEach(p => out.push(p.text));
    if (it.t === 'fill') out.push(`${it.before || ''} ${it.answer} ${it.after || ''}`.replace(/\s+([.,?!])/g, '$1'));

// Partes del cuento de la unidad (viñetas) para verdadero o falso y para ordenar

function lessonWords(lesson){

function makeFix(sents, rnd){

// Verdadero: una frase de este cuento. Falso: una frase bien escrita de otro cuento del mismo nivel (aquí no pasó).
function makeTF(story, others, rnd){

  const who = levelOf(unit) >= 3 ? ['Kim', 'Katy', 'PROD 1', 'PROD 2'] : ['Charlie', 'Rose', 'Ola'];

    chat:() => makeChat(qaPairs(sents).length ? qaPairs(sents) : qaPairs(unitSents), levelPairs, rnd, who[rnd(who.length)]),
    tf:() => makeTF(story, units().filter(u => u !== unit && levelOf(u) === levelOf(unit)).flatMap(unitStory), rnd),
    seq:() => makeSeq(story, rnd),

  return pick.map((s, i) => ({...s, extra:true, first:i === 0}));
