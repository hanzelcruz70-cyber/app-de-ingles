# Publica la función "admin-users" en Supabase.
# Necesita estos secrets en Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, PANDI_SETUP_TOKEN
name: Publicar función de cuentas (Supabase)
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Revisar que los secrets existan
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "${{ secrets.PANDI_SETUP_TOKEN }}" ]; then
            echo "::error::Faltan secrets. Agrega SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF y PANDI_SETUP_TOKEN en Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Guardar el código de configuración
        run: supabase secrets set --project-ref "$PROJECT_REF" PANDI_SETUP_TOKEN="${{ secrets.PANDI_SETUP_TOKEN }}"
      - name: Publicar admin-users
        run: supabase functions deploy admin-users --project-ref "$PROJECT_REF"
